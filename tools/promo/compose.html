<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pharloom promo</title>
<!-- tools/promo/compose.html: the announcement trailer, one frame per render(t) (tools/promo/make.js
     drives it; the real site's screens are its shots). Opened by hand through make.js's server,
     ?w=/__promo/#t=12.3 shows that moment and #play runs it in real time (no sound).
     It is cut to its music, Christopher Larkin's "Final Judge" (tools/promo/extract-game.py):
     73⅓ bpm, a beat every 9/11 s, the clip's beat 0 at its start; the film starts on the clip's
     beat 60 (MUSIC), so the film's beat n is at n × BEAT. Hornet falls through the first bar and
     lands on beat 4; one screen a bar from beat 12; one close-up a beat from 52, where the music
     is loudest; the title lands on beat 60, the clip's strongest hit, and the music falls quiet on
     beat 64. Hornet is the game's own animation (Fall, HardLand, Challenge Strong).
     The page's tokens (css/tokens.css) dress it: the main menu's black, red light and embers at
     either end, the white filigree, the bone ink, Cinzel and Spectral. The light effects (the
     flashes, the dust, the shade under the captions) are the film's own and stay here. -->
<link rel="stylesheet" href="../../css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: var(--font-body); color: var(--accent); }
  .layer { position: absolute; inset: 0; }
  #world { position: absolute; inset: -40px; }          /* room to shake */
  #world > * { position: absolute; left: 40px; top: 40px; width: 1920px; height: 1080px; }
  .scene { overflow: hidden; visibility: hidden; }
  .scene img.page { position: absolute; left: 0; top: 0; width: 1920px; transform-origin: 0 0; }
  .menu { background: var(--bg); }
  .menu .glow { position: absolute; inset: 0; background: var(--ember-glow); }
  .menu .vign { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 45%, transparent 40%, rgba(0,0,0,.6) 100%); }
  .vignette { background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }

  .hornet { position: absolute; background-repeat: no-repeat; transform-origin: 0 0; }
  .ground { position: absolute; height: 2px; background: var(--filigree); transform-origin: 50% 50%;
    box-shadow: 0 0 8px 1px rgba(255,255,255,.8), 0 0 30px 6px rgba(255,220,200,.25); }

  .title { position: absolute; left: 0; right: 0; text-align: center; }
  .title .crown { color: var(--filigree); display: block; margin: 0 auto; }
  .title h1 { font-family: var(--font-display); font-weight: 700; font-size: 112px; letter-spacing: .03em; line-height: 1; margin-top: 14px;
    text-shadow: 0 0 50px rgba(255, 120, 80, .25), 0 2px 6px rgba(0,0,0,.8); white-space: nowrap; }
  .title h1 .cap { font-size: 1.22em; }
  .title .for { font-family: var(--font-body); font-style: italic; font-weight: 300; font-size: 34px; color: var(--ink-2); margin-top: 22px; }
  .title .url { font-family: var(--font-display); font-weight: 500; font-size: 48px; letter-spacing: .08em; margin-top: 38px; }
  .title .facts { font-family: var(--font-display); font-size: 21px; letter-spacing: .3em; color: var(--ink-2); margin-top: 26px; text-transform: uppercase; }
  .legal { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 17px; color: var(--muted); }

  /* The game's area title card: a small line over the name, a flourish under it. */
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.82) 42%, rgba(0,0,0,.96) 100%); }
  .card { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; transform-origin: 50% 70%; }
  .sup { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: .34em; color: var(--ink-2); text-transform: uppercase; }
  .main { font-family: var(--font-display); font-weight: 600; font-size: 72px; letter-spacing: .02em; margin-top: 10px; line-height: 1.1;
    text-shadow: 0 0 30px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.9); }
  .flourish { display: block; margin: 16px auto 0; color: var(--filigree); opacity: .9; }

  .kick { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-family: var(--font-display); font-weight: 700;
    font-size: 190px; letter-spacing: .1em; line-height: 1; transform-origin: 50% 50%;
    text-shadow: 0 0 60px rgba(0,0,0,.95), 0 0 24px rgba(0,0,0,.9), 0 0 80px rgba(255,140,90,.25); }

  .chip { position: absolute; padding: 14px 26px 14px 22px; border: 1px solid rgba(241,235,220,.55); background: rgba(20,12,10,.92);
    font-family: var(--font-body); font-size: 28px; display: flex; gap: 14px; align-items: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.7), 0 0 30px rgba(241,235,220,.12); }
  .flash { background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(255,246,236,1) 0%, rgba(255,236,220,.9) 45%, rgba(230,190,170,.6) 100%); }
  .black { background: #000; }
</style>
</head>
<body>
<!-- The crown is the site's own (index.html's header). -->
<template id="crown"><svg width="300" height="42" viewBox="0 0 200 28" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M93 14 C84 14 78 7 69 7 C61 7 58 13 62 16.5 C65 19 69.5 16.5 68 13.5"/><path d="M62 16.5 C50 22 30 21 10 14"/><path d="M10 14 C6 12 5.5 8.5 9 8 C11.5 7.8 12 10.5 10.5 11.5"/><path d="M78 9 C74 3 66 1.5 58 3.5"/><g transform="translate(200 0) scale(-1 1)"><path d="M93 14 C84 14 78 7 69 7 C61 7 58 13 62 16.5 C65 19 69.5 16.5 68 13.5"/><path d="M62 16.5 C50 22 30 21 10 14"/><path d="M10 14 C6 12 5.5 8.5 9 8 C11.5 7.8 12 10.5 10.5 11.5"/><path d="M78 9 C74 3 66 1.5 58 3.5"/></g><path d="M100 5 L105 14 L100 23 L95 14 Z"/><path d="M100 1 V5 M100 23 V27"/></svg></template>

<div id="world"><div id="stage"></div><canvas id="fx" width="1920" height="1080"></canvas><div id="actors"></div></div>
<div id="over" class="layer"></div>

<script>
const W = 1920, H = 1080;
const BASE = new URLSearchParams(location.search).get('w') || '/__promo/';
const BEAT = 9 / 11;
const b = (n) => n * BEAT;
const DUR = b(64) + 2.2;
// For make.js: which track, where the film starts in it, and its fades.
window.MUSIC = { track: 'judge', from: b(60), fadeIn: 2.6, fadeOutAt: b(64) - .1, fadeOut: 2.2 };

const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, k) => a + (c - a) * k;
const ramp = (t, a, c) => clamp((t - a) / (c - a));
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeIn = (k) => k * k * k;
const sine = (k) => -(Math.cos(Math.PI * k) - 1) / 2;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const crown = (w = 300) => { const s = document.getElementById('crown').content.firstElementChild.cloneNode(true); s.setAttribute('width', w); s.setAttribute('height', w * .14); return s; };
const prime = (root) => root.querySelectorAll('path').forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
const draw = (root, k) => root.querySelectorAll('path').forEach((p) => { p.style.strokeDashoffset = p.dataset.len * (1 - k); });

/* ── The shots: a full-page capture (2x) seen through a camera, a rect in page px (centre x,
   centre y, width) eased from `from` to `to` over the shot. Beats, not seconds. ─────────── */
const SCENES = [
  { id: 'open', a: 0, z: 12, menu: true },
  { id: 'free', a: 12, z: 16, img: 'free', over: 'home', swap: 15, from: [960, 470, 1400], to: [900, 470, 1240],
    sup: 'Import your save', main: 'Your game, as it stands' },
  { id: 'pct', a: 16, z: 20, img: 'home', from: [690, 470, 980], to: [680, 505, 800],
    sup: 'Checked on 92 real saves', main: 'The same 100% the game counts' },
  { id: 'since', a: 20, z: 24, img: 'home', from: [640, 1030, 1120], to: [900, 1000, 1000],
    sup: 'Since your last save', main: 'What’s new. What’s near.' },
  { id: 'map', a: 24, z: 28, img: 'map', from: [960, 610, 1250], to: [950, 590, 1020],
    sup: 'The game’s own map', main: 'Everything you’re missing' },
  { id: 'zoom', a: 28, z: 32, img: 'map-zoom', from: [800, 520, 1000], to: [1050, 600, 860],
    sup: 'Piece by piece', main: 'Pinned where the game hides it' },
  { id: 'road', a: 32, z: 36, img: 'progress', from: [960, 430, 1240], to: [960, 640, 1100],
    sup: 'Act by act', main: 'The road ahead, step by step' },
  { id: 'journal', a: 36, z: 40, img: 'journal', from: [960, 470, 1240], to: [960, 1100, 1180],
    sup: 'The Hunter’s Journal', main: 'Every bug, every kill to go' },
  { id: 'inv', a: 40, z: 44, img: 'game', from: [720, 560, 1180], to: [760, 600, 1000],
    sup: 'The Inventory', main: 'Everything Hornet carries' },
  { id: 'crest', a: 44, z: 48, img: 'tools', from: [960, 560, 1250], to: [930, 610, 1100],
    sup: 'Crests and Tools', main: 'Every number of your build' },
  { id: 'legend', a: 48, z: 52, img: 'map-zoom', from: [960, 1250, 1300], to: [960, 1560, 1150],
    sup: 'What the map shows', main: 'Every secret, counted' },
  // The montage: a close-up a beat, and its word.
  { id: 'm1', a: 52, z: 53, img: 'game', rect: [545, 705, 620], kick: 'Masks' },
  { id: 'm2', a: 53, z: 54, img: 'game', rect: [575, 868, 640], kick: 'Silk' },
  { id: 'm3', a: 54, z: 55, img: 'game', rect: [1210, 905, 640], kick: 'Tools' },
  { id: 'm4', a: 55, z: 56, img: 'tools', rect: [760, 700, 620], kick: 'Crests' },
  { id: 'm5', a: 56, z: 57, img: 'journal', rect: [700, 810, 700], kick: 'Journal' },
  { id: 'm6', a: 57, z: 58, img: 'map-zoom', rect: [900, 560, 640], kick: 'Map' },
  { id: 'm7', a: 58, z: 59, img: 'progress', rect: [960, 860, 760], kick: 'Wishes' },
  { id: 'm8', a: 59, z: 60, img: 'home', rect: [525, 575, 520], kick: '100%' },
  { id: 'end', a: 60, z: 99, menu: true },
];
const stage = document.getElementById('stage'), actors = document.getElementById('actors'), over = document.getElementById('over');
const imgs = {};
const pageImg = (name) => { const i = $(`<img class="page" src="${BASE}shots/${name}.png">`); imgs[name] = true; return i; };
for (const s of SCENES) {
  s.t0 = b(s.a); s.t1 = b(s.z);
  s.el = $(`<div class="scene${s.menu ? ' menu' : ''}"></div>`);
  if (s.menu) s.el.append($('<div class="glow"></div>'), $('<div class="vign"></div>'));
  if (s.img) { s.page = pageImg(s.img); s.el.append(s.page); }
  if (s.over) { s.page2 = pageImg(s.over); s.el.append(s.page2); }
  stage.append(s.el);
}
const OPEN = SCENES[0], END = SCENES[SCENES.length - 1], FREE = SCENES[1];

/* ── Hornet: her clips in cells of one size around one origin (extract-game.py) ── */
const HS = 1.55, HX = 960, HY = 905;      // her scale, and where her feet land
const hornet = $('<div class="hornet"></div>');
const ground = $('<div class="ground"></div>');
actors.append(ground, hornet);
let HM = null;
function pose(clip, frame) {
  const c = HM.clips[clip], [cw, ch] = HM.cell;
  hornet.style.width = cw + 'px'; hornet.style.height = ch + 'px';
  hornet.style.backgroundImage = `url(${BASE}hornet/${c.file})`;
  hornet.style.backgroundSize = `${cw * c.n}px ${ch}px`;
  hornet.style.backgroundPosition = `${-frame * cw}px 0`;
}
function place(x, feetY, alpha = 1) {
  // The origin goes to x; the cell's floor (her feet, in HardLand) to feetY. Mirrored: she faces right.
  const [ox] = HM.origin, floor = HM.clips.HardLand.floor;
  hornet.style.transform = `translate(${x + ox * HS}px, ${feetY - floor * HS}px) scale(${-HS}, ${HS})`;
  hornet.style.opacity = alpha;
}
// Which clip and frame at time t: Fall until she lands, HardLand, a held last frame, then Challenge Strong, looping its tail.
const LAND = b(4), SLASH = b(6);
function hornetAt(t) {
  if (t < LAND) { const c = HM.clips.Fall, f = Math.floor((t - b(2.4)) * c.fps); return ['Fall', f < c.n ? Math.max(0, f) : c.loopStart + (f - c.loopStart) % (c.n - c.loopStart)]; }
  const hl = HM.clips.HardLand, cs = HM.clips['Challenge Strong'];
  const cs0 = SLASH - 3 / cs.fps;     // her arc's widest frame on the beat
  if (t < cs0) return ['HardLand', Math.min(hl.n - 1, Math.floor((t - LAND) * hl.fps))];
  const f = Math.floor((t - cs0) * cs.fps);
  return ['Challenge Strong', f < cs.n ? f : cs.loopStart + (f - cs.loopStart) % (cs.n - cs.loopStart)];
}

/* ── Titles ──────────────────────────────────────────────────────────── */
const T1 = $(`<div class="title" style="top:250px"><div class="cw"></div>
  <h1><span class="cap">P</span>HARLOOM <span class="cap">C</span>ALCULATOR</h1>
  <div class="for">Your Hollow Knight: Silksong save, read the way the game reads it</div></div>`);
T1.querySelector('.cw').append(crown());
const T2 = $(`<div class="title" style="top:330px"><div class="cw"></div>
  <h1><span class="cap">P</span>HARLOOM <span class="cap">C</span>ALCULATOR</h1>
  <div class="url">pharloomcalculator.com</div>
  <div class="facts">Free · No account · English and Español</div></div>`);
T2.querySelector('.cw').append(crown());
const legal = $(`<div class="legal">Unofficial fan project, not affiliated with Team Cherry. Hollow Knight: Silksong, its art and music © Team Cherry. Music: “Final Judge”, Christopher Larkin.</div>`);
OPEN.el.append(T1); END.el.append(T2, legal);
prime(T1); prime(T2);

const shade = $('<div class="layer shade" style="top:auto"></div>');
const vign = $('<div class="layer vignette"></div>');
over.append(vign, shade);
for (const s of SCENES) {
  if (s.main) {
    s.card = $(`<div class="card"><div class="sup">${s.sup}</div><div class="main">${s.main}</div></div>`);
    const fl = crown(240); fl.classList.add('flourish'); s.card.append(fl); prime(s.card);
    over.append(s.card);
  }
  if (s.kick) { s.kickEl = $(`<div class="kick">${s.kick}</div>`); over.append(s.kickEl); }
}
const chip = $(`<div class="chip"><svg width="30" height="36" viewBox="0 0 30 36" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2h16l8 8v24H3z"/><path d="M19 2v8h8"/></svg>user1.dat</div>`);
const flash = $('<div class="layer flash"></div>'), black = $('<div class="layer black"></div>');
over.append(chip, flash, black);

/* ── Particles: the menu's embers, the dust of her landing; seeded, so every render is the same ── */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const EMBERS = Array.from({ length: 90 }, () => ({ x: rnd() * W, ph: rnd(), v: 40 + rnd() * 90, sway: 10 + rnd() * 40,
  sf: .2 + rnd() * .6, r: .8 + rnd() * 2.2, tw: 1 + rnd() * 3, tp: rnd() * 6.28 }));
const DUST = Array.from({ length: 46 }, () => ({ dir: rnd() < .5 ? -1 : 1, v: 250 + rnd() * 900, up: 40 + rnd() * 260, r: 3 + rnd() * 9, life: .5 + rnd() * .9 }));
const BURST = Array.from({ length: 60 }, () => ({ a: rnd() * 6.283, v: 200 + rnd() * 700, r: 1 + rnd() * 2.5, life: .8 + rnd() * 1.4 }));
const ctx = document.getElementById('fx').getContext('2d');
function ember(x, y, r, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
  // --mote's ember (#f18b45), with a hotter core
  g.addColorStop(0, `rgba(255,190,120,${a})`); g.addColorStop(.25, `rgba(241,139,69,${a * .8})`); g.addColorStop(1, 'rgba(241,139,69,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 5, 0, 6.283); ctx.fill();
}
function particles(t, amount, speed) {
  ctx.clearRect(0, 0, W, H);
  for (const e of EMBERS) {
    const span = H + 120, y = H + 60 - ((e.ph * span + t * e.v * speed) % span);
    const x = e.x + Math.sin(t * e.sf + e.tp) * e.sway;
    const a = amount * clamp(.3 + .7 * (y / H)) * (.55 + .45 * Math.sin(t * e.tw + e.tp));
    if (a > .01) ember(x, y, e.r, a);
  }
  // Her landing: dust along the ground, a ring, sparks.
  const d = t - LAND;
  if (d > 0 && d < 2.4) {
    for (const p of DUST) {
      const k = d / p.life; if (k >= 1) continue;
      const x = HX + p.dir * (40 + p.v * (1 - Math.exp(-d * 3)) / 3), y = HY - p.up * Math.sin(Math.PI * clamp(k * .9)) * .35 - 6;
      ctx.fillStyle = `rgba(225,212,200,${.38 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(x, y, p.r * (1 + k * 2.5), 0, 6.283); ctx.fill();
    }
    const k = easeOut(clamp(d / .7));
    ctx.strokeStyle = `rgba(255,240,230,${.7 * (1 - k)})`; ctx.lineWidth = 3 * (1 - k) + .5;
    ctx.beginPath(); ctx.ellipse(HX, HY, 40 + 900 * k, 10 + 70 * k, 0, 0, 6.283); ctx.stroke();
  }
  // The title's landing: sparks out from the centre.
  const e = t - b(60);
  if (e > 0 && e < 3) for (const p of BURST) {
    const k = e / p.life; if (k >= 1) continue;
    const dist = p.v * (1 - Math.exp(-e * 2.2)) / 2.2;
    ember(W / 2 + Math.cos(p.a) * dist * 1.6, 470 + Math.sin(p.a) * dist * .7, p.r, 1 - k);
  }
}

/* ── One frame ───────────────────────────────────────────────────────── */
function camera(img, [cx, cy, w], punch = 0) {
  const s = (W / w) * (1 + punch);
  img.style.transform = `translate(${W / 2 - cx * s}px, ${H / 2 - cy * s}px) scale(${s})`;
}
// A small push on every beat, a bigger one on a cut: the camera breathes with the music.
const beatKick = (t) => { const p = t / BEAT, k = p - Math.floor(p); return .012 * Math.exp(-k * BEAT / .12); };
// A shake, decaying, after a hit at time h.
const shake = (t, h, amp, len) => { const d = t - h; if (d < 0 || d > len) return [0, 0]; const f = amp * (1 - d / len) ** 2; return [f * Math.sin(d * 71), f * Math.cos(d * 53)]; };

function render(t) {
  let cur = SCENES.findIndex((s) => t >= s.t0 && t < s.t1); if (cur < 0) cur = SCENES.length - 1;
  const S = SCENES[cur];
  for (const s of SCENES) s.el.style.visibility = s === S ? 'visible' : 'hidden';
  const since = t - S.t0;                                  // time into the shot
  const cutPunch = S.a >= 12 ? .07 * Math.exp(-since / .22) : 0;
  if (S.img) {
    const r = S.rect ? [S.rect[0], S.rect[1], lerp(S.rect[2] * 1.12, S.rect[2], easeOut(ramp(since, 0, BEAT)))]
      : S.from.map((v, i) => lerp(v, S.to[i], sine(ramp(t, S.t0, S.t1))));
    const punch = cutPunch + (S.rect ? 0 : beatKick(t));
    camera(S.page, r, punch);
    if (S.page2) { camera(S.page2, r, punch); S.page2.style.opacity = ramp(t, b(S.swap) - .02, b(S.swap) + .03); }
    S.page.style.filter = S.kick ? 'brightness(.55) saturate(.9)' : '';
  }

  // The world shakes where something lands: Hornet, and the title.
  const [sx1, sy1] = shake(t, LAND, 16, .6), [sx2, sy2] = shake(t, b(60), 12, .5), [sx3, sy3] = shake(t, SLASH, 5, .25);
  document.getElementById('world').style.transform = `translate(${sx1 + sx2 + sx3}px, ${sy1 + sy2 + sy3}px)`;

  // Opening: the menu's dark, her fall, her landing, the title cut by her needle.
  hornet.style.opacity = 0; ground.style.opacity = 0;
  if (S === OPEN) {
    OPEN.el.querySelector('.glow').style.opacity = .35 + .45 * ease(ramp(t, 0, b(4))) + .3 * Math.exp(-Math.max(0, t - LAND) / .5) * (t > LAND);
    if (t > b(2.4)) {
      const [clip, f] = hornetAt(t); pose(clip, f);
      const y = t < LAND ? lerp(-260, HY, easeIn(ramp(t, b(2.4), LAND))) : HY;
      place(HX, y);
    }
    if (t > LAND) {
      const k = easeOut(ramp(t, LAND, LAND + .5));
      ground.style.opacity = .9 - .5 * ramp(t, LAND + .5, LAND + 2);
      ground.style.width = '1500px'; ground.style.left = (W / 2 - 750) + 'px'; ground.style.top = (HY - 1) + 'px';
      ground.style.transform = `scaleX(${k})`;
    }
    // The title: cut open by the arc of her needle, from the middle out, on beat 6.
    const ks = easeOut(ramp(t, SLASH - .05, SLASH + .2));
    T1.style.opacity = t > SLASH - .05 ? 1 : 0;
    T1.querySelector('h1').style.clipPath = `inset(-20% ${(1 - ks) * 50}% -20% ${(1 - ks) * 50}%)`;
    T1.querySelector('h1').style.transform = `scale(${1 + .08 * Math.exp(-Math.max(0, t - SLASH) / .25)})`;
    draw(T1.querySelector('.cw'), ease(ramp(t, SLASH, SLASH + 1.4)));
    const kf = easeOut(ramp(t, b(8), b(8) + .8));
    const fo = T1.querySelector('.for'); fo.style.opacity = kf; fo.style.transform = `translateY(${(1 - kf) * 14}px)`;
  }
  // End: the title lands on beat 60.
  if (S === END) {
    const d = t - b(60);
    END.el.querySelector('.glow').style.opacity = .85 + .4 * Math.exp(-d / .6);
    const k = easeOut(clamp(d / .35));
    const h1 = T2.querySelector('h1'); h1.style.opacity = k; h1.style.transform = `scale(${lerp(1.35, 1, k)})`; h1.style.filter = `blur(${(1 - k) * 10}px)`;
    draw(T2.querySelector('.cw'), ease(ramp(d, .1, 1.3)));
    const step = (a, z, el) => { const q = easeOut(ramp(d, a, z)); el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * 12}px)`; };
    step(b(1), b(1) + .7, T2.querySelector('.url'));
    step(b(2), b(2) + .7, T2.querySelector('.facts'));
    step(b(3), b(3) + .7, legal);
  }
  particles(t, S.menu ? 1 : .3, S === OPEN && t < LAND ? 1.8 : 1);

  // Captions, slammed in on the cut.
  let shadeOn = 0;
  for (const s of SCENES) if (s.card) {
    const on = s === S;
    s.card.style.visibility = on ? 'visible' : 'hidden';
    if (!on) continue;
    const kin = easeOut(ramp(since, .05, .45)), kout = ramp(t, s.t1 - .2, s.t1);
    s.card.style.opacity = kin * (1 - kout);
    s.card.style.transform = `scale(${lerp(1.1, 1, kin)})`;
    s.card.querySelector('.main').style.filter = `blur(${(1 - kin) * 8}px)`;
    s.card.querySelector('.sup').style.letterSpacing = `${.34 + (1 - kin) * .3}em`;
    draw(s.card.querySelector('.flourish'), ease(ramp(since, .3, 1.3)));
    shadeOn = 1;
  }
  shade.style.opacity = shadeOn;
  for (const s of SCENES) if (s.kickEl) {
    const on = s === S, k = easeOut(ramp(since, 0, .16));
    s.kickEl.style.opacity = on ? k : 0;
    s.kickEl.style.transform = `translateY(-50%) scale(${lerp(1.5, 1, k) + since * .06})`;
  }

  // The save dropped into the unlit card, landing on beat 15, and the light it brings.
  const SW = b(FREE.swap);
  const kd = easeIn(ramp(t, SW - .7, SW));
  chip.style.opacity = t > SW - .8 && t < SW + .05 ? ramp(t, SW - .8, SW - .6) : 0;
  chip.style.transform = `translate(${lerp(1380, 880, kd)}px, ${lerp(120, 470, kd)}px) rotate(${lerp(10, 0, kd)}deg) scale(${lerp(1.1, .75, kd)})`;

  // Flashes: her landing, the save's light, each cut, the title.
  let fl = 0;
  const hit = (h, a, len) => { const d = t - h; if (d >= 0 && d < len) fl = Math.max(fl, a * (1 - d / len) ** 2); };
  hit(LAND, .85, .45); hit(SLASH, .35, .25); hit(SW, .95, .8); hit(b(60), .9, .7);
  for (const s of SCENES) if (s.a >= 16 && s.a < 60) hit(s.t0, s.kick ? .35 : .22, .2);
  flash.style.opacity = fl;

  black.style.opacity = Math.max(1 - ramp(t, 0, .8), ramp(t, DUR - .8, DUR));
}

window.ready = (async () => {
  HM = await (await fetch(BASE + 'hornet/hornet.json')).json();
  const sheets = Object.values(HM.clips).map((c) => { const i = new Image(); i.src = `${BASE}hornet/${c.file}`; return i.decode(); });
  await Promise.all([document.fonts.ready, ...sheets, ...[...document.images].map((i) => i.decode())]);
  render(0);
  return true;
})();
window.render = render; window.DUR = DUR;
if (location.hash.startsWith('#t=')) window.ready.then(() => render(parseFloat(location.hash.slice(3))));
if (location.hash === '#play') window.ready.then(() => { const t0 = performance.now(); const f = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(f); }; f(); });
</script>
</body>
</html>
