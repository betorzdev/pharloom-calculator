<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pharloom promo</title>
<!-- tools/promo/compose.html: the announcement video, one frame per render(t) (tools/promo/make.js
     drives it; the real site's screens are its shots). Opened by hand through make.js's server,
     ?shots=/__promo/shots/#t=12.3 shows that moment and #play runs it in real time.
     The page's tokens (css/tokens.css) dress it: the main menu's black, red light and embers at
     either end, the white filigree, the bone ink, Cinzel and Spectral. The light effects (the
     silk's glow, the flash as the save lights the card, the shade under the captions) are the
     film's own and stay here. -->
<link rel="stylesheet" href="../../css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: var(--font-body); color: var(--accent); }
  .layer { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .scene img.page { position: absolute; left: 0; top: 0; width: 1920px; transform-origin: 0 0; }
  .menu { background: var(--bg); }
  .menu .glow { position: absolute; inset: 0; background: var(--ember-glow); }
  .menu .vign { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%); }
  canvas { position: absolute; inset: 0; }

  /* The game's area title card: a small line over the name, a flourish under it. */
  .card { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 400px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.8) 42%, rgba(0,0,0,.95) 100%); }
  .sup { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: .34em; color: var(--ink-2); text-transform: uppercase; }
  .main { font-family: var(--font-display); font-weight: 500; font-size: 68px; letter-spacing: .02em; color: var(--accent); margin-top: 10px; line-height: 1.1;
    text-shadow: 0 0 30px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.9); }
  .flourish { display: block; margin: 16px auto 0; color: var(--filigree); opacity: .9; }

  .title { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .title .crown { color: var(--filigree); }
  .title h1 { font-family: var(--font-display); font-weight: 700; font-size: 104px; letter-spacing: .03em; margin-top: 18px; line-height: 1;
    text-shadow: 0 0 40px rgba(255, 120, 80, .18); white-space: nowrap; }
  .title h1 .cap { font-size: 1.22em; }
  .title .for { font-family: var(--font-body); font-style: italic; font-weight: 300; font-size: 34px; color: var(--ink-2); margin-top: 26px; }
  .title .url { font-family: var(--font-display); font-weight: 500; font-size: 46px; letter-spacing: .08em; color: var(--accent); margin-top: 40px; }
  .title .facts { font-family: var(--font-display); font-size: 20px; letter-spacing: .3em; color: var(--ink-2); margin-top: 26px; text-transform: uppercase; }
  .legal { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 17px; color: var(--muted); letter-spacing: .02em; }

  .thread { position: absolute; left: 0; height: 2px; background: var(--filigree); transform-origin: 0 50%;
    box-shadow: 0 0 6px 1px rgba(255,255,255,.85), 0 0 22px 4px rgba(255,235,220,.35); }
  .hornet { position: absolute; width: 120px; height: 120px; background: url('../../assets/hornet/run.png') 0 0 / 1200px 120px; }
  .chip { position: absolute; padding: 14px 26px 14px 22px; border: 1px solid rgba(241,235,220,.55); background: rgba(20,12,10,.92);
    font-family: var(--font-body); font-size: 28px; color: var(--accent); display: flex; gap: 14px; align-items: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.7), 0 0 30px rgba(241,235,220,.12); }
  .chip svg { color: var(--accent); }
  .flash { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 80% at 47% 42%, rgba(255,246,236,1) 0%, rgba(255,236,220,.92) 35%, rgba(240,200,180,.55) 75%, rgba(200,150,130,.35) 100%); }
  .black { position: absolute; inset: 0; background: #000; }
  .chip, .flash { z-index: 1; } .shade { z-index: 2; } .card { z-index: 3; } .thread, .hornet { z-index: 4; } .black { z-index: 10; }
</style>
</head>
<body>
<!-- The crown is the site's own (index.html's header). -->
<template id="crown"><svg width="300" height="42" viewBox="0 0 200 28" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M93 14 C84 14 78 7 69 7 C61 7 58 13 62 16.5 C65 19 69.5 16.5 68 13.5"/><path d="M62 16.5 C50 22 30 21 10 14"/><path d="M10 14 C6 12 5.5 8.5 9 8 C11.5 7.8 12 10.5 10.5 11.5"/><path d="M78 9 C74 3 66 1.5 58 3.5"/><g transform="translate(200 0) scale(-1 1)"><path d="M93 14 C84 14 78 7 69 7 C61 7 58 13 62 16.5 C65 19 69.5 16.5 68 13.5"/><path d="M62 16.5 C50 22 30 21 10 14"/><path d="M10 14 C6 12 5.5 8.5 9 8 C11.5 7.8 12 10.5 10.5 11.5"/><path d="M78 9 C74 3 66 1.5 58 3.5"/></g><path d="M100 5 L105 14 L100 23 L95 14 Z"/><path d="M100 1 V5 M100 23 V27"/></svg></template>

<div id="stage" class="layer"></div>
<canvas id="embers" width="1920" height="1080"></canvas>
<div id="fx" class="layer"></div>

<script>
const W = 1920, H = 1080, SHOTS = new URLSearchParams(location.search).get('shots') || '/__promo/shots/';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;      // in-out cubic
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const sine = (k) => -(Math.cos(Math.PI * k) - 1) / 2;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const crown = () => document.getElementById('crown').content.firstElementChild.cloneNode(true);

/* ── The timeline ─────────────────────────────────────────────────────────
   Each shot is a full-page capture of the real site (2x), seen through a camera: a rect in
   page px (centre x, centre y, width) eased from `from` to `to` over the shot. */
const DUR = 45;
const SHOTS_LIST = [
  { id: 'open',  t0: 0,    t1: 4.4,  menu: true },
  { id: 'free',  t0: 4.4,  t1: 10.4, img: 'free.png', over: 'home.png', swap: 7.0,
    from: [960, 480, 1440], to: [900, 470, 1260],
    sup: 'Import your save', main: 'Your game, as it stands', cap: [4.9, 10.0] },
  { id: 'pct',   t0: 10.4, t1: 15.4, img: 'home.png', from: [690, 455, 1020], to: [680, 505, 820],
    sup: 'Checked on 92 real saves', main: 'The same 100% the game counts', cap: [10.8, 15.0] },
  { id: 'since', t0: 15.4, t1: 20.4, img: 'home.png', from: [640, 1030, 1120], to: [900, 1000, 1020],
    sup: 'Since your last save', main: 'What’s new. What’s near.', cap: [15.8, 20.0] },
  { id: 'map',   t0: 20.4, t1: 26.0, img: 'map.png', from: [960, 600, 1300], to: [930, 575, 840],
    sup: 'The game’s own map', main: 'Everything you’re missing, pinned', cap: [20.8, 25.6] },
  { id: 'road',  t0: 26.0, t1: 30.6, img: 'progress.png', from: [960, 430, 1240], to: [960, 640, 1120],
    sup: 'Act by act', main: 'The road ahead, step by step', cap: [26.4, 30.2] },
  { id: 'journal', t0: 30.6, t1: 35.2, img: 'journal.png', from: [960, 470, 1240], to: [960, 1130, 1180],
    sup: 'The Hunter’s Journal', main: 'Every bug, every kill to go', cap: [31.0, 34.8] },
  { id: 'inv',   t0: 35.2, t1: 37.4, img: 'game.png', from: [700, 560, 1180], to: [740, 590, 1040],
    sup: 'Crests and Tools', main: 'Every number of your build', cap: [35.6, 39.8] },
  { id: 'crest', t0: 37.4, t1: 40.2, img: 'tools.png', from: [960, 560, 1250], to: [940, 605, 1140], quick: true },
  { id: 'end',   t0: 40.2, t1: DUR,  menu: true, end: true },
];

const stage = document.getElementById('stage'), fx = document.getElementById('fx');
for (const s of SHOTS_LIST) {
  s.el = $(`<div class="scene${s.menu ? ' menu' : ''}"></div>`);
  if (s.menu) s.el.append($('<div class="glow"></div>'), $('<div class="vign"></div>'));
  if (s.img) { s.page = $(`<img class="page" src="${SHOTS + s.img}">`); s.el.append(s.page); }
  if (s.over) { s.page2 = $(`<img class="page" src="${SHOTS + s.over}">`); s.el.append(s.page2); }
  stage.append(s.el);
}

// Opening and closing titles.
const open = SHOTS_LIST[0], end = SHOTS_LIST[SHOTS_LIST.length - 1];
open.title = $(`<div class="title"><div class="crown-wrap"></div>
  <h1><span class="cap">P</span>HARLOOM <span class="cap">C</span>ALCULATOR</h1>
  <div class="for">Your Hollow Knight: Silksong save, read the way the game reads it</div></div>`);
open.title.querySelector('.crown-wrap').append(crown());
open.el.append(open.title);
end.title = $(`<div class="title"><div class="crown-wrap"></div>
  <h1><span class="cap">P</span>HARLOOM <span class="cap">C</span>ALCULATOR</h1>
  <div class="url">pharloomcalculator.com</div>
  <div class="facts">Free · No account · English and Español</div></div>`);
end.title.querySelector('.crown-wrap').append(crown());
end.legal = $(`<div class="legal">Unofficial fan project, not affiliated with Team Cherry. Hollow Knight: Silksong, its art and music © Team Cherry.</div>`);
end.el.append(end.title, end.legal);
for (const s of [open, end]) s.el.querySelectorAll('.crown-wrap path').forEach((p) => {
  const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L;
});

// Captions, one per shot that has one.
const shade = $('<div class="shade"></div>'); fx.append(shade);
for (const s of SHOTS_LIST) if (s.main) {
  s.card = $(`<div class="card"><div class="sup">${s.sup}</div><div class="main">${s.main}</div></div>`);
  const fl = crown(); fl.setAttribute('class', 'flourish'); fl.setAttribute('width', '240'); fl.setAttribute('height', '34');
  s.card.append(fl); fx.append(s.card);
  s.card.querySelectorAll('path').forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
}
// The save file dropped into the unlit card.
const chip = $(`<div class="chip"><svg width="30" height="36" viewBox="0 0 30 36" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2h16l8 8v24H3z"/><path d="M19 2v8h8"/></svg>user1.dat</div>`);
const flash = $('<div class="flash"></div>');
const thread = $('<div class="thread"></div>'), thread2 = $('<div class="thread"></div>');
const hornet = $('<div class="hornet"></div>');
const black = $('<div class="black"></div>');
fx.append(chip, flash, thread, thread2, hornet, black);

/* ── Embers: the main menu's, seeded so every render is the same ──────── */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const EMBERS = Array.from({ length: 70 }, () => ({ x: rnd() * W, ph: rnd(), v: 40 + rnd() * 90, sway: 10 + rnd() * 40,
  sf: .2 + rnd() * .6, r: .8 + rnd() * 2.2, tw: 1 + rnd() * 3, tp: rnd() * 6.28 }));
const ctx = document.getElementById('embers').getContext('2d');
function embers(t, amount) {
  ctx.clearRect(0, 0, W, H);
  if (amount <= 0) return;
  for (const e of EMBERS) {
    const span = H + 120, y = H + 60 - ((e.ph * span + t * e.v) % span);
    const x = e.x + Math.sin(t * e.sf + e.tp) * e.sway;
    const life = 1 - y / H;   // fade as they rise
    const a = amount * clamp(.25 + .75 * (1 - life * .9)) * (.55 + .45 * Math.sin(t * e.tw + e.tp));
    if (a <= 0.01) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, e.r * 5);
    // --mote's ember (#f18b45), with a hotter core
    g.addColorStop(0, `rgba(255,190,120,${a})`); g.addColorStop(.25, `rgba(241,139,69,${a * .8})`); g.addColorStop(1, 'rgba(241,139,69,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, e.r * 5, 0, 6.283); ctx.fill();
  }
}

/* ── One frame ───────────────────────────────────────────────────────── */
function camera(img, rect) {
  const [cx, cy, w] = rect, s = W / w;
  img.style.transform = `translate(${W / 2 - cx * s}px, ${H / 2 - cy * s}px) scale(${s})`;
}
function drawPaths(root, k) {
  root.querySelectorAll('path').forEach((p) => { p.style.strokeDashoffset = p.dataset.len * (1 - k); });
}
// The thread transition into shot s: the silk is drawn across, then opens into the next shot.
const TA = .5, TB = .45;
function reveal(s, t) {
  // fraction of the next shot shown, as an inset from the middle
  const k = easeOut(ramp(t, s.t0, s.t0 + TB));
  return k;
}
function titleIn(root, t, t0) {
  const c = root.querySelector('.crown-wrap'), h = root.querySelector('h1');
  drawPaths(c, ease(ramp(t, t0, t0 + 1.4)));
  c.style.opacity = ramp(t, t0, t0 + .3);
  const k = easeOut(ramp(t, t0 + .5, t0 + 1.7));
  h.style.opacity = k; h.style.transform = `translateY(${(1 - k) * 18}px)`; h.style.filter = `blur(${(1 - k) * 8}px)`;
  h.style.letterSpacing = `${.03 + (1 - k) * .06}em`;
  return (a, b, el) => { const q = easeOut(ramp(t, t0 + a, t0 + b)); el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * 12}px)`; };
}

function render(t) {
  // Which shots are on: the current one, and the one before while the thread opens.
  let cur = SHOTS_LIST.findIndex((s) => t >= s.t0 && t < s.t1); if (cur < 0) cur = SHOTS_LIST.length - 1;
  const S = SHOTS_LIST[cur], P = SHOTS_LIST[cur - 1];
  for (const s of SHOTS_LIST) { s.el.style.visibility = 'hidden'; s.el.style.clipPath = ''; s.el.style.zIndex = 0; }
  const opening = P && t < S.t0 + TB;
  for (const s of opening ? [P, S] : [S]) {
    s.el.style.visibility = 'visible';
    const k = ramp(t, s.t0, s.t1);
    if (s.img) {
      const r = s.from.map((v, i) => lerp(v, s.to[i], sine(k)));
      camera(s.page, r); if (s.page2) camera(s.page2, r);
      if (s.page2) s.page2.style.opacity = ease(ramp(t, s.swap - .12, s.swap + .12));
    }
  }
  if (opening) {
    S.el.style.zIndex = 2;
    const k = reveal(S, t);
    S.el.style.clipPath = `inset(${(1 - k) * 50}% 0 ${(1 - k) * 50}% 0)`;
  }

  // The thread: drawn across in the TA before a shot starts, then split to the edges as it opens.
  thread.style.opacity = thread2.style.opacity = 0;
  const N = SHOTS_LIST[cur + 1];
  const quick = (x) => x && x.quick;
  if (N && t > N.t0 - TA) {
    const k = ease(ramp(t, N.t0 - TA, N.t0));
    thread.style.top = (H / 2 - 1) + 'px'; thread.style.width = W + 'px';
    thread.style.transform = `scaleX(${k})`; thread.style.opacity = 1;
  }
  if (opening) {
    const k = easeOut(ramp(t, S.t0, S.t0 + TB));
    const y = (1 - k) * (H / 2);
    for (const [el, top] of [[thread, y - 1], [thread2, H - y - 1]]) {
      el.style.top = top + 'px'; el.style.width = W + 'px'; el.style.transform = 'scaleX(1)'; el.style.opacity = 1 - k * k;
    }
  }

  // Hornet runs the thread into the first shot and into the end card: she draws the silk.
  hornet.style.opacity = 0;
  for (const into of [SHOTS_LIST[1], end]) {
    if (t > into.t0 - TA - .05 && t < into.t0) {
      const k = ease(ramp(t, into.t0 - TA, into.t0));
      const frame = Math.floor(t * 15) % 10;
      hornet.style.opacity = 1;
      hornet.style.backgroundPosition = `${-frame * 120}px 0`;
      hornet.style.transform = `translate(${k * W - 40}px, ${H / 2 - 104}px) scale(-1.3, 1.3)`;
    }
  }

  // Embers: full over the menu, a breath over the shots.
  embers(t, S.menu ? 1 : .35);

  // Opening title.
  if (S === open || (opening && P === open)) {
    const step = titleIn(open.title, t, .5);
    step(1.6, 2.6, open.title.querySelector('.for'));
    open.el.querySelector('.glow').style.opacity = ease(ramp(t, 0, 2));
    const fade = 1 - ramp(t, 3.6, 3.95);
    open.title.style.opacity = fade;
  }
  // End card.
  if (S === end) {
    const step = titleIn(end.title, t, end.t0 + .35);
    step(1.5, 2.3, end.title.querySelector('.url'));
    step(2.0, 2.8, end.title.querySelector('.facts'));
    step(2.4, 3.2, end.legal);
    end.el.querySelector('.glow').style.opacity = 1;
  }

  // Captions.
  let shadeOn = 0;
  for (const s of SHOTS_LIST) if (s.card) {
    const [a, b] = s.cap;
    const kin = easeOut(ramp(t, a, a + .9)), kout = ramp(t, b - .45, b);
    const on = kin * (1 - kout);
    s.card.style.opacity = on;
    s.card.style.visibility = on > 0 ? 'visible' : 'hidden';
    const sup = s.card.querySelector('.sup'), main = s.card.querySelector('.main');
    sup.style.letterSpacing = `${.34 + (1 - kin) * .25}em`;
    const km = easeOut(ramp(t, a + .15, a + 1.05));
    main.style.transform = `translateY(${(1 - km) * 14}px)`; main.style.filter = `blur(${(1 - km) * 6}px)`;
    drawPaths(s.card.querySelector('.flourish'), ease(ramp(t, a + .35, a + 1.5)));
    shadeOn = Math.max(shadeOn, ramp(t, a - .3, a + .4) * (1 - ramp(t, b - .2, b + .3)));
  }
  shade.style.opacity = shadeOn;

  // The save dropped into the unlit card, and the light it brings.
  const F = SHOTS_LIST[1];
  const kd = ease(ramp(t, F.swap - 1.3, F.swap - .15));
  chip.style.opacity = t > F.swap - 1.4 && t < F.swap + .3 ? Math.min(ramp(t, F.swap - 1.4, F.swap - 1.1), 1 - ramp(t, F.swap - .2, F.swap + .15)) : 0;
  chip.style.transform = `translate(${lerp(1390, 860, kd)}px, ${lerp(150, 470, kd)}px) rotate(${lerp(8, 0, kd)}deg) scale(${lerp(1.05, .7, ramp(t, F.swap - .4, F.swap + .1))})`;
  flash.style.opacity = t > F.swap - .3 ? (t < F.swap ? easeOut(ramp(t, F.swap - .3, F.swap - .1)) : 1 - easeOut(ramp(t, F.swap + .05, F.swap + .85))) : 0;

  // From black, and to black.
  black.style.opacity = Math.max(1 - ramp(t, 0, .6), ramp(t, DUR - .7, DUR));
}

window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode())]).then(() => { render(0); return true; });
window.render = render; window.DUR = DUR;
// Preview in a browser: #t=12.3 shows that moment; #play runs it in real time.
if (location.hash.startsWith('#t=')) window.ready.then(() => render(parseFloat(location.hash.slice(3))));
if (location.hash === '#play') window.ready.then(() => { const t0 = performance.now(); const f = () => { const t = (performance.now() - t0) / 1000; render(t % DUR); requestAnimationFrame(f); }; f(); });
</script>
</body>
</html>
