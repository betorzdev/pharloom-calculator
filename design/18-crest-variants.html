<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">

<title>Crest: variants</title>
<!-- Design material, not part of the site (design/03-redesign.md, step 8). The Crest screen drawn
     three ways over Save 4's build (Hunter, evolution 2). The Crest and its slots as the game places
     them: each ToolCrest in dataassets/tools/crestitems.bundle lists its slots with a position (in
     units from the Crest's centre), a type (0 red, 1 blue, 2 yellow, 3 Silk Skill) and whether it's
     locked (a Memory Locket opens it); the Crest's art is its crestSprite (crest.spriteatlas), the
     slots the game's own frames (inventory.spriteatlas: UI_tool_slot_attack / defend / explore /
     weave, UI_tool_slot_locked_fill), white and tinted by colour. The Vesticrest's extra slots float
     beside it ("Floating Slots"). Figures are today's for Save 4. ?v=a|b|c&w=1440|390 -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
.mk-bar { position: fixed; z-index: 90; left: 50%; bottom: var(--sp-2); transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1) var(--sp-3); width: max-content; max-width: calc(100vw - var(--sp-4)); padding: var(--sp-2) var(--sp-3); background: color-mix(in oklab, var(--scene-bg) 94%, transparent); border: 1px solid var(--line-panel); font-family: var(--font-num); font-size: var(--fs-xs); color: var(--muted); }
.mk-bar b { color: var(--label); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; font-size: var(--fs-2xs); }
.mk-bar button { padding: var(--sp-1) var(--sp-2); border: 1px solid var(--line-ctl); color: var(--ink-2); font: inherit; }
.mk-bar button[aria-pressed="true"] { color: var(--ink-strong); border-color: var(--accent-line); background: var(--picked); }
.mk-note { flex-basis: 100%; text-align: center; color: var(--ink-2); }
html.is-framed body { background: var(--scene-bg); }
.mk-phone { display: block; margin: var(--sp-4) auto calc(var(--sp-16) * 2); width: 390px; height: calc(100vh - var(--sp-16) * 2 - var(--sp-8)); border: 1px solid var(--line-panel); }
html.is-inner .mk-bar { display: none; }
.page { padding-top: var(--sp-8); padding-bottom: calc(var(--sp-16) * 2.5); }
.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.lbl { margin: 0; font-size: var(--fs-2xs); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--label); }

/* The Crest with its slots where the game puts them: --k px to the game's unit. */
.crest { --k: 64px; position: relative; width: calc(var(--k) * 6.6); height: calc(var(--k) * 6.2); margin: 0 auto; }
.crest > .art { position: absolute; left: 50%; top: 50%; width: calc(var(--k) * 5.05); transform: translate(-50%, -50%); opacity: .9; filter: drop-shadow(0 0 14px color-mix(in oklab, var(--silk) 25%, transparent)); }
.slot { --c: var(--slot-red); position: absolute; left: calc(50% + var(--x) * var(--k)); top: calc(50% - var(--y) * var(--k)); width: calc(var(--k) * .95); height: calc(var(--k) * .95); transform: translate(-50%, -50%); display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; }
.slot::before { content: ''; position: absolute; inset: 0; background: var(--c); -webkit-mask: var(--g) center / contain no-repeat; mask: var(--g) center / contain no-repeat; opacity: .9; }
.slot.is-blue { --c: var(--slot-blue); } .slot.is-yellow { --c: var(--slot-yellow); } .slot.is-skill { --c: var(--slot-skill); }
.slot.is-locked::before { background: var(--slot-locked); opacity: .6; }
.slot.is-full::before { opacity: .35; }
.slot img { position: relative; width: 78%; height: 78%; object-fit: contain; filter: drop-shadow(0 0 6px color-mix(in oklab, var(--c) 60%, transparent)); }
.slot.is-sel { outline: 1px solid var(--accent); outline-offset: 3px; border-radius: 50%; }
.float { position: absolute; right: 0; bottom: 0; display: grid; gap: var(--sp-2); }
.float .slot { position: relative; left: auto; top: auto; transform: none; }
.cname { display: flex; align-items: center; justify-content: center; gap: var(--sp-4); margin: var(--sp-2) 0 0; }
.cname h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); color: var(--ink-strong); letter-spacing: var(--track-title); }
.cname small { color: var(--muted); font-size: var(--fs-xs); }
.arw { width: var(--ctl-sm); height: var(--ctl-sm); display: grid; place-items: center; color: var(--ink-2); border: 1px solid var(--line-ctl); border-radius: 50%; }

/* Figures as big numbers only. */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: var(--sp-4) var(--sp-6); }
.fig b { display: block; font-family: var(--font-num); font-size: var(--fs-2xl); color: var(--ink-strong); line-height: 1.1; }
.fig span { font-size: var(--fs-xs); color: var(--muted); }
.fig.is-big b { font-size: calc(var(--fs-2xl) * 1.6); }
.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2) var(--sp-4); }
.lvl { display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3); border: 1px solid var(--line); font-size: var(--fs-xs); color: var(--ink-2); }
.lvl img { width: 22px; height: 22px; object-fit: contain; }
.lvl b { font-family: var(--font-num); color: var(--ink-strong); }
.lvl button { color: var(--muted); width: 20px; }

/* The Tool list by colour. */
.tl { display: grid; gap: var(--sp-4); }
.tl-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: var(--sp-1); }
.tl-row button { position: relative; aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 0; border-bottom: 2px solid var(--c); background: none; }
.tl-row button img { width: 80%; height: 80%; object-fit: contain; }
.tl-row button.is-on { background: color-mix(in oklab, var(--c) 14%, transparent); }
.tl-row button.is-off img { filter: var(--missing-art); opacity: .6; }
.tl-row.is-red button { --c: var(--slot-red); } .tl-row.is-blue button { --c: var(--slot-blue); } .tl-row.is-yellow button { --c: var(--slot-yellow); } .tl-row.is-skill button { --c: var(--slot-skill); }
.desc { padding: var(--sp-4); border-top: 1px solid var(--line); display: grid; gap: var(--sp-1); }
.desc h4 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--ink-strong); }
.desc p { margin: 0; font-size: var(--fs-sm); color: var(--ink-2); }
.desc .n { color: var(--ink-strong); }

.a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-8); align-items: start; }
.a-top { margin: var(--sp-4) 0 var(--sp-8); padding-bottom: var(--sp-6); border-bottom: 1px solid var(--line); }
.b-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-8); align-items: center; margin: var(--sp-4) 0 var(--sp-8); padding-bottom: var(--sp-6); border-bottom: 1px solid var(--line); }
.b-needle { display: flex; align-items: center; gap: var(--sp-4); }
.b-needle img { height: 150px; }
.skills { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-4); text-align: center; }
.skills img { width: 56px; height: 56px; object-fit: contain; }
.skills b { display: block; font-family: var(--font-num); font-size: var(--fs-xl); color: var(--ink-strong); }
.skills span { font-size: var(--fs-xs); color: var(--ink-2); }
.fold { display: flex; justify-content: space-between; align-items: center; padding: var(--sp-3) 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: var(--sp-6); font-size: var(--fs-2xs); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--ink-2); }
.c { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--sp-8); align-items: center; margin-top: var(--sp-4); }
.c .figs { grid-template-columns: 1fr 1fr; }
.pick { max-width: 560px; margin: var(--sp-6) auto 0; padding: var(--sp-4); border: 1px solid var(--line-ctl); background: var(--scene-floor); box-shadow: var(--shadow-md); }
.pick .lbl { margin-bottom: var(--sp-3); }
@media (max-width: 899px) {
  .crest { --k: 48px; }
  .a, .b-hero, .c { grid-template-columns: minmax(0, 1fr); }
  .skills { grid-template-columns: repeat(3, 1fr); }
  .b-needle img { height: 96px; }
}
</style>
