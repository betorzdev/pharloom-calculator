<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen title plaque: variants</title>
<!-- Design material, not part of the site. The plaque round a screen's title was clear, so it
     straddled the page (above the frame) and the plate's tab-coloured light (below): two
     backgrounds in one piece. Four ways to make it one, each on four tabs' colours. -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
.mk { max-width: var(--page-max); margin: 0 auto; padding: var(--sp-8) var(--page-pad) var(--sp-16); display: grid; gap: var(--sp-12); }
.mk > p.lead { max-width: var(--measure); color: var(--ink-2); font-size: var(--fs-sm); }
.mk-v > b { display: block; margin-bottom: var(--sp-6); font-family: var(--font-num); font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--label); }
.mk-v > i { display: block; margin-top: var(--sp-3); font-style: normal; font-size: var(--fs-xs); color: var(--muted); }
.mk-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--sp-8); }
.mk-v .screen { min-height: 130px; padding: var(--sp-8) var(--sp-4); }
.mk-v .screen p.body { color: var(--ink-2); font-size: var(--fs-sm); text-align: center; margin-top: var(--sp-6); }
.mk-v .screen-head { padding: var(--sp-2) var(--sp-4); }
.v-now .screen-plaque polygon:not(.is-inner) { fill: none; }
.mk-v .screen-title { position: relative; }

/* A · solid black (the PR's fix): the plate's own black in the plaque, tab-coloured outline. */
.v-a .screen-plaque polygon:not(.is-inner) { fill: var(--inv-bg); }

/* B · above the frame: the whole plaque on the page over the frame's edge, the line whole under it. */
.v-b .screen-head { top: calc(var(--frame-inset) - var(--sp-6)); }
.v-b .screen { margin-top: var(--sp-8); }
.v-b .frame-line { border-top-color: color-mix(in oklab, var(--tab) var(--tab-frame), transparent); }
.v-b .frame-line::before, .v-b .frame-line::after { display: none; }
.v-b .screen-plaque polygon:not(.is-inner) { fill: var(--inv-bg); }

/* C · inside the frame: under the whole top line, on the plate's tab light, no fill. */
.v-c .screen-head { top: calc(var(--frame-inset) + var(--sp-6)); }
.v-c .screen { padding-top: calc(var(--sp-12) + var(--sp-4)); }
.v-c .frame-line { border-top-color: color-mix(in oklab, var(--tab) var(--tab-frame), transparent); }
.v-c .frame-line::before, .v-c .frame-line::after { display: none; }

/* D · tab-tinted fill: solid, the black with the tab's colour in it. */
.v-d .screen-plaque polygon:not(.is-inner) { fill: color-mix(in oklab, var(--tab) 28%, var(--inv-bg)); }
</style>
</head>
<body>
<div class="page"><div class="mk">
  <p class="lead">Before the fix the plaque is clear: its top half is on the page's dark red and its bottom half on the plate's tab-coloured light, so one label shows two backgrounds. Four ways to make it one piece, each on four tabs.</p>
  <div id="list" style="display:grid;gap:var(--sp-12)"></div>
</div></div>
<script>
(function () {
  const CORNER = '<svg class="bk-art" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 46 V18 C4 10 10 4 18 4 H46"/><path d="M10 30 C10 16 16 10 30 10"/><path d="M18 18 C21 14 26 15 25 19 C24 22 20 21 21 18.5"/><path d="M4 4 L8 8"/></svg>';
  const frame = '<span class="frame-line"></span>' + ['tl', 'tr', 'bl', 'br'].map((c) => '<span class="bk ' + c + '">' + CORNER + '</span>').join('');
  const PLAQUE = '<svg class="screen-plaque" viewBox="0 0 100 30" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><polygon points="6,1 94,1 99.5,15 94,29 6,29 0.5,15" vector-effect="non-scaling-stroke"/><polygon class="is-inner" points="8,4 92,4 96.5,15 92,26 8,26 3.5,15" vector-effect="non-scaling-stroke"/></svg>';
  const TABS = [['game', 'Your game'], ['map', 'Map'], ['tools', 'Inventory'], ['fight', 'Crest']];
  const V = [['v-now', 'Before', 'clear plaque: half page, half plate.'],
    ['v-a', 'A · solid black (recommended, in the PR)', 'the plate\'s black fills the plaque; the tab colour stays in the outline and the frame.'],
    ['v-b', 'B · above the frame', 'the whole plaque on the page over the frame\'s edge; the frame\'s line runs whole under it.'],
    ['v-c', 'C · inside the frame', 'the plaque under the whole top line, on the plate\'s tab light, no fill.'],
    ['v-d', 'D · tab-tinted fill', 'solid, black tinted with the tab colour; the plaque reads as the tab\'s own piece.']];
  document.getElementById('list').innerHTML = V.map(([cls, name, note]) =>
    '<div class="mk-v ' + cls + '"><b>' + name + '</b><div class="mk-row">' + TABS.map(([v, t]) =>
      '<section class="screen" data-view="' + v + '">' + frame + '<header class="screen-head">' + PLAQUE + '<h2 class="sec-title screen-title">' + t + '</h2></header><p class="body">What the screen holds…</p></section>').join('') + '</div><i>' + note + '</i></div>').join('');
  for (const sc of document.querySelectorAll('.screen')) sc.style.setProperty('--title-half', (sc.querySelector('.screen-head').offsetWidth / 2) + 'px');
})();
</script>
</body>
</html>
