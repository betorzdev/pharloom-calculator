<script>window.JJ = [["mossgrub","Mossgrub","Fur covered crawler with a series of sharp spikes along its back.","If not for the spikes, I would think it an appealing bug.",25,29,0,"Moss Grotto"],["massive-mossgrub","Massive Mossgrub","Unnaturally overgrown Mossgrub, bred within the Citadel's Memorium.","So close to a perfect furred form... If only they'd been able to breed out the spines.",3,-1,0,"Memorium"],["mossmir","Mossmir","Small fluttering creature capable of defending itself with its small stinger.","This bug is soft and clumsy, but to its fortune its home caves seem relatively free of effective predators. I wonder why that is.",20,10,0,"Weavenest Atla"],["moss-mother","Moss Mother","Adult Mossmir with a fully developed stinger and hardened hide.","Motherhood is an instinct that can push creatures beyond what seems their natural limits. It turns even weaker beasts like these into formidable foes.",3,3,0,"Moss Grotto"],["aknid","Aknid","Winged insect that feeds upon moss and lichen in the caves above Bone Bottom.","In its natural state it would avoid potential predators, but Pharloom's Haunting now compels it to aggression. Fortunately, its jaws are ill-suited for combat.",15,8,0,"Bone Bottom"],["skull-scuttler","Skull Scuttler","Small, soft bug that uses the hard skulls of the Marrow for protection and disguise.","In every land, creatures find new and surprising ways to disguise themselves. One must be wary always.",35,19,0,"The Marrow"],["skullwing","Skullwing","Airborne relative of the grounded Skull Scuttler, found only in the Marrow's deepest, hottest caves.","Such feeble creatures could only survive thanks to the rarity of predators in these super-heated caverns.",15,13,0,"The Abyss"],["skull-brute","Skull Brute","Soft bug beneath a huge, horned skull. Charges at intruders to protect its territory and its smaller companions.","Either its size has made it fearless or the Haunting has removed its sense of self-preservation.",15,12,0,"The Marrow"],["skull-tyrant","Skull Tyrant","Rare, enormous Skull Scuttler. The Marrow's largest predator, and the most feared for its ferocious temperament.","Though surely fierce, the skull it bears looks taken from an even larger beast. If not for the bones as proof, I would scarcely believe bugs could grow to such scale.",1,1,0,"The Marrow"],["kilik","Kilik","Small bony bug that favours dark tunnels. Can expand its spiked carapace to ward against attacking predators.","I am fond of simple, effective traps such as this bug's extendable spikes. An unwary predator would be skewered clean through.",25,11,0,"The Marrow"],["beastfly","Beastfly","Aggressive fly of Pharloom's lowlands. Rams prey with its hardbone mask.","Dancing around this simple creature as it charges back and forth is the sort of game I delighted in as a child. Alas, I now have more pressing matters to attend to.",30,24,0,"Deep Docks"],["savage-beastfly","Savage Beastfly","Angered, adult Beastfly with a weighty body and a thickened hardshell mask.","Civilisation encroaches from this kingdom's crown, but the lowlands are still ruled by great beasts. Its roar stirs something deep within me, some primal instinct.",2,2,0,"Hunter's March"],["caranid","Caranid","Common winged bug of the lowlands. Generally docile, but will attack if threats come close.","Their plump, round shape makes them well-suited for target practice. Difficult to resist testing my aim on them...",25,23,0,"Bone Bottom"],["vicious-caranid","Vicious Caranid","Aggressive winged bug of the lowlands. When angered, it rapidly whips its bladed tail as a weapon.","Its wings are quite small compared to its bulk. Perhaps it uses the warm air of these fiery lands to help stay airborne. Clever, if so.",15,7,0,"Hunter's March"],["hardbone-hopper","Hardbone Hopper","Grazing creature with sharp senses that nimbly retreats from danger.","Despite the Haunting of its shell, it has not been overcome with aggression. Its desire to flee remains too strong.",20,4,0,"Deep Docks"],["hardbone-elder","Hardbone Elder","Tall creature with sharp senses. Defends its herd with powerful legs and a sharp-tipped mask.","There is surprising strength hidden in their thin, elegant limbs. It would be a pleasure to ride upon it...",10,-1,0,"Far Fields"],["tarmite","Tarmite","Flying bone mite that lives near magma. Roasts its prey by spitting scorching tar.","Its sticky spit would no doubt make a useful crafting material if moulded fresh. Unfortunately, I cannot stop to experiment.",10,6,0,"Far Fields"],["mawling","Mawling","Young, bony bug that can curl its body to form a ball.","Their rough, ridged shell grips tight to any surface. Even walls and roofs become pathways for these nimble bugs.",30,5,0,"Moss Grotto"],["marrowmaw","Marrowmaw","Giant roller of the lowlands. Its ridged hide will crush smaller creatures beneath it.","Sheer bulk makes for an effective weapon, but requires much sustenance. This creature would have spent most of its time eating. An acceptable life for some.",8,4,0,"Weavenest Atla"],["hoker","Hoker","Spine-shooting drifter of the lowlands.","Whatever admiration I had for its fleecy down is spoilt by its disturbing mask... and its steely spines.",15,10,0,"Far Fields"],["flintbeetle","Flintbeetle","Rarely seen beetle that spends most of its life nestled deep in bone and rock. The Flintgems on its shell excrete an explosive powder.","Its bright gems could be used to make beautiful, but short-lived jewellery. An amusing idea for a gift... or a trap.",3,3,1,"The Marrow"],["rhinogrund","Rhinogrund","Long-horned beast of Pharloom's lowlands. Relies on its horn both to impale and to wrench the ground beneath it, flinging dangerous debris.","Certain tools and skills can pierce its defences. I should adjust my strategy as needed.",2,-1,0,"Memorium"],["gromling","Gromling","Young masked worm that delights in ambushing intruders within its tunnels.","A frustrating fiend. They flee beneath the bone whenever I try to strike them down.",25,5,0,"Wormways"],["grom","Grom","Burrowing worm that uses its many blunted teeth to dig through even the hardest bone.","They ceaselessly churn through rock and bone without ever seeming to rest. Do they have a destination? Or are they compelled to dig forever deeper?",10,-1,0,"Wormways"],["bell-beast","Bell Beast","Huge, hardbone bug that lives within and travels through the veins of old bells across Pharloom.","This one has allied themself with me, either as thanks for their saving or respect for one judged as equal. Whichever the reason, their fellowship is welcome.",1,1,0,"The Marrow"],["pilgrim-groveller","Pilgrim Groveller","Basic bug of Pharloom, laid low upon the ground.","Taken by Pharloom's Haunting, the bug is now capable of little more than prayer and aggression.",35,19,0,"Bone Bottom"],["pilgrim-pouncer","Pilgrim Pouncer","Agile bug of Pharloom, its higher functions have been lost to the Haunting.","With a softer shell than most, they would have relied on their athleticism to survive.",35,19,0,"Bone Bottom"],["pilgrim-hornfly","Pilgrim Hornfly","Short pilgrim that uses their long horn to launch upon threats.","Birth equipped this one well. In its assault it becomes its own projectile.",15,4,0,"Bone Bottom"],["pilgrim-hulk","Pilgrim Hulk","Sturdy bug lost to the Haunting. Rolls at threats with no care for its own discomfort.","A rare built bug within these ailing lands. Most pilgrims' shells seem small by comparison. What nourishment did they discover to grow so large?",10,4,0,"Shellwood"],["pilgrim-bellbearer","Pilgrim Bellbearer","Common bug wielding a set of old bells. The bug will fling the bells at anyone it deems still free.","Their bells would once have rung with hope and mirth, lifting the spirits of any climbing companions. Sadly, those instruments have turned purely to combative use.",10,3,0,"Bone Bottom"],["winged-pilgrim","Winged Pilgrim","Short-horned bug born with underdeveloped wings.","Flight it possesses, but only just. It may lift from the stone, but those sad wings would never carry it far.",25,7,0,"Bone Bottom"],["elder-pilgrim","Elder Pilgrim","Thick-set bug consumed by haunted thread. Uses their solid frame to crush others.","A lucky bug to be able to grow old. Pharloom's roads take most much earlier.",5,1,0,"The Marrow"],["winged-pilgrim-bellbearer","Winged Pilgrim Bellbearer","Pilgrim endowed with large wings, carrying a brace of iron bells.","On uneven terrain their union of flight and range can prove a challenge even for me.",10,3,0,"Shellwood"],["pilgrim-hiker","Pilgrim Hiker","Hard-shelled bug with a climber's pin. Their pin, once aid, has become a weapon, though the bug is unrefined in its use.","A bug once frail, pushed by twisted thread beyond its mortal limits.",10,3,0,"Blasted Steps"],["pilgrim-guide","Pilgrim Guide","Old pilgrim carrying a heavy iron bell staff.","The large bell seems to signify them as once leader of a climbing troupe, though the Haunting has erased that former authority.",15,4,0,"Greymoor"],["overgrown-pilgrim","Overgrown Pilgrim","Aged pilgrim, overgrown with lichen and moss.","The moss looks to grow even inside their stomach, which the pilgrim spits at foes in compressed gobs. A foul form of offence.",20,6,0,"Bone Bottom"],["covetous-pilgrim","Covetous Pilgrim","Strong bug replete with rosaries. If angered they will whip their strings in a ceaseless onslaught.","Is this abundance a sign of purity or greed? The way faith is measured in this land is curious indeed.",2,1,0,"Bone Bottom"],["snitchfly","Snitchfly","Pernicious looter found all over Pharloom.","While these bothersome bugs are left free to forage, no loose rosary or trinket is safe.",4,2,0,"Bone Bottom"],["lavalug","Lavalug","Sticky mollusc that defends itself by spraying burning fluid from growths on its back.","What seems at first a purely defensive mechanism may also be necessary to rid this creature of excess heat.",12,3,0,"Deep Docks"],["lavalarga","Lavalarga","Fully grown mollusc able to unleash a gushing torrent of burning fluid from its back.","To survive while storing so much searing fluid within... Before I would have believed it impossible, but Pharloom is home to many marvels.",8,1,0,"Deep Docks"],["smelt-shoveller","Smelt Shoveller","Low level worker lost to Pharloom's Haunting. Instinct keeps them at their task, though in much simpler fashion than before.","This kingdom appears more advanced in metalwork than my own ever was, in great part due to the natural heat source at its base. Working in such an environment is an impressive feat.",25,13,0,"The Marrow"],["flintstone-flyer","Flintstone Flyer","Aerial worker lost to Pharloom's Haunting. Bears a pouch full with flintstone which they will fling at intruders.","That incendiary material they carry is a natural wonder, with many potential applications. What a waste to carelessly throw it at me whenever I pass by.",25,12,0,"Deep Docks"],["flintflame-flyer","Flintflame Flyer","Brave worker carrying unstable flintflame and wearing a heavy bell to protect against potential ignition.","Theirs would be a high risk life, followed by a short, searing end.",10,6,0,"Deep Docks"],["smokerock-sifter","Smokerock Sifter","Cymbal bearing worker of the Deep Docks. Pans the hauls of smokerock to find traces of more precious minerals.","The Haunting has stolen some important part of these bugs, yet still they attempt their former task. Until, that is, they sense my presence...",10,8,0,"Deep Docks"],["deep-diver","Deep Diver","Bell-clad bug responsible for mining the deeper, treacherous depths below their docks.","Their heavier bells armour them well against my strikes, but against that oppressive heat... can they help at all?",5,1,0,"Deep Docks"],["forebrothers-signis-and-gron","Forebrothers Signis & Gron","Elder overseers of the Deep Docks, responsible for the oversight and punishment of lesser workers.","Lost in the madness of the Haunting, they still commanded the endless excavation of their caves.",1,1,0,"Deep Docks"],["cragglite","Cragglite","Infant form of the more formidable Craggler.","If left to grow, these young bugs will fight for dominance until only one remains.",3,1,0,"Wormways"],["craggler","Craggler","Thick-plated scuttler that prefers high places.","Holds an extensive supply of searing acid in a layered sack within its shell. The acid rains from its mouth upon any creature it sees as food.",1,1,0,"Wormways"],["brushflit","Brushflit","Tiny, timid creatures that huddle in flocks and flee at the first hint of danger.","They call out to warn their fellows at the smallest sense of threat. A successful hunt here means staying silent and hidden right up until the decisive strike.",15,-1,0,"Far Fields"],["fertid","Fertid","Skittish scrambler of the Far Fields. Its antennae resemble stalks of grass to aid in camouflage.","It has no means to defend itself. Its only hope for survival is to be mistaken for a plant.",25,15,0,"Far Fields"],["flapping-fertid","Flapping Fertid","Docile bug whose wings mimic the grasses of the Far Fields. A common snack for larger predators.","When roosting, it would look convincingly plant-like. In flight, its bulbous body quickly ruins the ruse.",20,4,0,"Far Fields"],["fourth-chorus","Fourth Chorus","Towering iron automaton, driven by rotor and cog.","A terrifying achievement of Pharloom, to build a construct so large and yet so nimble.",1,1,0,"Far Fields"],["skarrlid","Skarrlid","Small burrowing ant, servant to the larger Skarr.","These bugs work mainly as finders and foragers for the warriors of their tribe. Combat has not long been their nature.",25,18,0,"Greymoor"],["skarrwing","Skarrwing","Darting predator that clings fast to roofs and outcrops, often summoned to aid its larger companions.","They would make effective hunting companions, though even without the Haunting I suspect their loyalty would always remain to their clan.",30,16,0,"Hunter's March"],["skarr-scout","Skarr Scout","Young ant hunter wielding sickles carved from teeth. Will often call for aid if danger comes close.","Despite their youth, they are impressive opponents. It seems likely their tribe were trained for combat from birth.",20,20,0,"Hunter's March"],["skarr-stalker","Skarr Stalker","Skilled ant hunter bearing blade and armour fashioned from bone.","Fierce, strong and disciplined... yet these qualities do not protect them from the Haunting. Is such a fate inevitable in these lands?",15,12,0,"Hunter's March"],["spear-skarr","Spear Skarr","Winged ant hunter that strikes from the air with its bone lance.","In my youth, I envied all bugs with wings. I even fancied I might grow a pair... I have since learned better. Accept the limitations of one's body... and augment with tools as needed.",10,5,0,"Hunter's March"],["skarrgard","Skarrgard","Huge ant hunter tasked to protect the stores and passages of its tribe.","Theirs is the perfect shell for their duty, a wall of a warrior and an adept fighter. If I hope to claim their treasures, I must bring my best.",2,3,0,"Hunter's March"],["gurr-the-outcast","Gurr the Outcast","Huge, yet stealthy Skarr. An expert trapper and master of the undergrowth.","His tracks and traps... It should have been obvious from the start, this old hunter sought to draw me in. But what reason drove him to test himself so brutally? That answer I suspect I shall never know.",1,-1,0,"Far Fields"],["last-claw","Last Claw","Elite former hunter acting as the final line of defence before their mother.","Their skill once saw them chosen, and I can plainly see why. They would have lived and trained only for this duty.",6,-1,0,"Far Fields"],["skarrsinger-karmelita","Skarrsinger Karmelita","Song queen of the Skarr and their most talented warrior.","This graceful ruler once possessed skill to rival my own. At her youthful peak, her voice united all Skarr in her service.",1,-1,0,"Far Fields"],["mite","Mite","Verminous pest, common throughout the dark corners of Greymoor.","Individually they offer little challenge, but their numbers are surely vast, and most remain hidden.",30,22,0,"Greymoor"],["fluttermite","Fluttermite","Airborne pest, less common than its grounded siblings. Attacks with sharp fangs if agitated.","Similar bugs would gnaw away at unguarded food supplies in my homeland. As a child, I would hunt them, eager to make use of myself and test my skills.",25,9,0,"Greymoor"],["mitemother","Mitemother","Aged female mite, grown larger and stronger than most of its kin.","Poor of sight but possessing a keen sense of smell, it uses its bulk to charge at foreign scents. Remaining fierce so far into old age is an admirable trait.",10,-1,0,"Greymoor"],["dreg-catcher","Dreg Catcher","Bug charged to catch dregs of Silk that fall from the Citadel. Will attack with its staff if provoked.","These bugs look to have spent every waking moment at their work. Grim, endless labour in service of the unseen Citadel above.",20,6,0,"Greymoor"],["silk-snipper","Silk Snipper","Scissor-wielding bug charged to cut and spool fallen dregs of Silk for return to the Citadel above.","Is it the Haunting that drove them to cackling madness, or was their unending toil the cause even before that?",25,4,0,"Greymoor"],["thread-raker","Thread Raker","Tall bug charged to pile Silk dregs in preparation for respooling. Their sharp rake now doubles equally well as a stabbing weapon.","Theirs seems a sad, grueling task, serving their lifetime for a Citadel unseen.",15,1,0,"Greymoor"],["moorwing","Moorwing","Winged mite-beast, bred large to catch workers who once tried to flee their tasks.","With its wranglers long dead, the Moorwing stalked the towers of Greymoor, feasting on passing pilgrims and tenders alike.",1,1,0,"Greymoor"],["wisp","Wisp","Short-lived sprite born of flickering flame.","To live only a single, bright moment... What would one feel? Is it glorious, or only despair? Or could it be both, mixed equal?",15,15,0,"Wisp Thicket"],["burning-bug","Burning Bug","Many-legged insect fanatically obsessed with flame.","These ones somehow learnt to call and guide the scorching Wisps that share their thicket. Whether through dominance or reverence is unclear.",8,8,0,"Wisp Thicket"],["father-of-the-flame","Father of the Flame","Totem and god, built and worshipped by the Burning Bugs.","The remains of an aged bug were housed at the pyre's heart. The structure suggested they wished for immolation. If so, I have seen their wish granted.",1,3,0,"Wisp Thicket"],["craw","Craw","Screeching scavenger that roosts high in caverns and preys on passing pilgrims.","By this swooping menace, a simple bug could be easily overcome. More dangerous still, they rarely attack alone.",25,22,0,"Greymoor"],["tallcraw","Tallcraw","Rag-winged adult crawbug bearing a scavenged pin.","Far more hostile than their younger companions but seemingly less likely to roam far from their nest.",20,7,0,"Greymoor"],["squatcraw","Squatcraw","Stout adult crawbug bearing several short pins.","A cowardly sort. They will try to remain at range to throw their sharp weapons. Best to rush them down and cut quick.",15,5,0,"Greymoor"],["craw-juror","Craw Juror","Screeching scavenger dyed black in mourning at their land's collapse.","Weak, afraid, and aware of the imminent end. I understand their desperation, but my death will not prevent the coming fall.",15,-1,0,"Greymoor"],["tallcraw-juror","Tallcraw Juror","Elder crawbug serving in a sacred ceremony.","Curiosity saw me answer their summons, but I shall not allow them to stall me long. I must work fast to fix my grand mistake.",10,-1,0,"Greymoor"],["squatcraw-juror","Squatcraw Juror","Short elder crawbug eagerly serving in their court.","They seek to slay their only chance at survival. Alas, any words would fall useless. I have only my blade to offer response.",8,-1,0,"Greymoor"],["crawfather","Crawfather","Lord and justice of Pharloom's craws. Delivers death to condemned bugs with his steel-plated beak.","Did he recognise my part played in this land's void-strung state? If so, perhaps his judgment was not unfair. To these bugs I have brought much destruction.",1,-1,0,"Greymoor"],["muckmaggot","Muckmaggot","Mindless infant larva, coated in thick slime.","They cling fast to the shells of other bugs, destroying any hope for concentration or comfort.",80,-1,0,"Bilewater"],["slubberlug","Slubberlug","Younger form of a Muckroach. Attacks prey by leaping from the water and snapping with its flexible jaws.","These creatures look to have been bred deliberately in watery pens. If they are food to be, their scent suggests they must taste vile.",12,-1,0,"Bilewater"],["muckroach","Muckroach","Starved pack bug with an insatiable appetite. Despite their tough hide and pungent meat, roaches breed rapidly so are sometimes farmed for food.","A revolting creature. My shell itches at their presence. In the pens where their numbers grow vast, I am forever on edge.",20,12,0,"Sinner's Road"],["bloatroach","Bloatroach","Obese offshoot of Muckroaches, born of the Citadel's exhaust smog. The winged roach's sagging stomach is filled with sizzling bile.","Its form is absurd... Surely it should not be able to hold itself in the air? The noxious gases in its stomach must provide its levity.",12,-1,0,"Bilewater"],["roachcatcher","Roachcatcher","Short, nimble bug who uses barbed bolas to keep beasts corralled and caged.","Their throwing weapon is well-suited to the wide caverns they inhabit. These sly little bugs must have a keen claw for crafting.",20,6,0,"Sinner's Road"],["roachfeeder","Roachfeeder","Tall roach tender charged to feed Muckroaches on a lean diet of maggot gruel.","The feeder's curled pin looks designed to keep ravenous roaches at bay, and the tender from turning into the meal.",20,8,0,"Sinner's Road"],["roachkeeper","Roachkeeper","Grizzled older roach tender weighted with a lasso of heavy chain.","Though their mind is largely lost their skill with a chain has not been forgotten. Does the Haunting eternally bind a bug to the task it had in life?",10,1,0,"Sinner's Road"],["roachserver","Roachserver","Brutish cook responsible for dicing Muckroach meat into edible portions.","Could their actions be called skill? I see only a crude mangling of meat. Yet I wonder, before the Haunting snared their minds was it any different?",10,10,0,"Sinner's Road"],["disgraced-chef-lugoli","Disgraced Chef Lugoli","Once exalted chef, exiled from the Citadel for repeated culinary crimes.","Returned to their home caves, this chef continued to devise delicacies too repulsive for any bug still sane.",1,1,0,"Sinner's Road"],["wraith","Wraith","Anguished spectre of lingering thread. Despite its ephemeral nature, strong strikes can dispel the Wraith for a time.","Not a bug but a projection of another's will cast in smog and Silk.",10,10,0,"The Mist"],["mothleaf-lagnia","Mothleaf Lagnia","A rare, calmer bug of Bilewater, survives its hazardous surroundings by hiding as a plant.","This one is pretty, but not as soft as first it seems. The plant it mimics is flaked and coarse, and the bug's coat shares similar texture.",25,3,0,"Bilewater"],["miremite","Miremite","Crawling insect with a sizzling bile sack in its abdomen.","The threat of its exploding rear is an effective deterrent to predators, but the slightest jolt or fall can cause its premature end.",20,8,0,"Bilewater"],["swamp-squit","Swamp Squit","Plentiful pest with a sharp proboscis and a belly full of bile.","More dangerous in the moment of its explosive and corrosive death than it ever was in life.",30,28,0,"Bilewater"],["spit-squit","Spit Squit","Hovering pest with a hollowed proboscis able to spit gobs of sizzling bile.","To subsist on the sickly water in this fetid environment it spits out the most toxic elements. Over generations, this former survival technique has turned into an effective hunting tool.",20,2,0,"Putrified Ducts"],["stilkin","Stilkin","Cunning bug that hunts with darts fashioned from stake and bile.","They know well their domain, lurking in wait in its byways and bogs, always ready to pounce.",15,6,0,"Bilewater"],["stilkin-trapper","Stilkin Trapper","Trap setting bug carrying a pouch of sharpened long-stakes.","More bother than the bug themself are the countless traps they have already laid throughout their caves.",12,20,0,"Bilewater"],["groal-the-great","Groal the Great","Chief and chaplain of the Stilkin, forever raging against the Citadel that chokes their caves and sees them suffer.","This one's strength was much enhanced by stolen soul. They are not the first who tried to hoard it, or to mould it towards such violent ends.",1,1,0,"Bilewater"],["barnak","Barnak","Toothy growth that lives on cave roofs. Wraps wayward bugs with its long tongue and drags them up to be consumed.","Hiding its tongue amongst fronds so similar... There is impressive style to this one's trickery.",8,2,0,"Putrified Ducts"],["ductsucker","Ductsucker","Suction creature surviving on the thick slime that coats its caves.","This mindless bug seems to sense only through its tendrils, yet despite that simplicity it still poses a serious threat.",6,-1,0,"Putrified Ducts"],["pond-skipper","Pond Skipper","Hard-shelled insect common upon the surface of Shellwood Pond. Once a staple food for passing pilgrims.","The way they skate along the water's surface is so elegant. Surely it is a skill that can be learned? When time permits, I should attempt the task.",15,1,0,"Shellwood"],["pondcatcher","Pondcatcher","Old catcher over Shellwood Pond, bearing a longpin and stricken by the Haunting.","Once a hunter purely for food, now they hunt unthinking and unending.",20,2,0,"Shellwood"],["shellwood-gnat","Shellwood Gnat","Tiny, soft creature that armours itself using the hard, hollow growths of Shellwood.","If the woody hide is shattered, the bug will still bravely, foolishly try to attack.",15,3,0,"Shellwood"],["wood-wasp","Wood Wasp","Pointed, darting insect that builds a hardy hive from Shellwood's dried bark.","Destroying the hives will limit their presence in the wood. Useful to me now, as I pass along the branches. Dangerous in time for the wood's order. Even a small disruption can tip a fragile balance.",12,1,0,"Shellwood"],["splinter","Splinter","Insect formed to imitate a branch, capable of remaining perfectly still for long periods, but unexpectedly swift when roused.","Avoiding their ambush is a good test of my senses, and my ability to rapidly retaliate.",12,2,0,"Shellwood"],["splinterhorn","Splinterhorn","Insect formed to imitate a branch, born with sharp, retractable horns atop its head.","Its shell gives it the advantage of surprise, but also forces it into a slender, brittle shape that cannot withstand a heavy attack.",10,2,0,"Shellwood"],["splinterbark","Splinterbark","Winged insect with a flaky shell that perfectly mimics its environment.","Its assault... like a young bug's toy turned deadly. Could I, in time, fashion a spinning tool to match?",10,8,0,"Shellwood"],["sister-splinter","Sister Splinter","Imposing old insect nesting in the heights of Shellwood. Her command of twig and branch ensured no pilgrim ever survived within her territory.","This one lived long and fed much. The wood will be much safer for their slaying.",1,1,0,"Shellwood"],["phacia","Phacia","Drifting bug disguised as a flower. Disperses crackling clouds of pollen if threatened.","Quite a beautiful creature. In my own kingdom's court, it would have been highly favoured as an ornamental pet.",25,16,0,"Shellwood"],["pollenica","Pollenica","Floral foe that reacts instinctively to movement nearby. Spits pellets of crackling pollen that burst on impact.","What exceptional senses it possesses. It detects me with ease, even when not a single sound is made.",10,2,0,"Shellwood"],["gahlia","Gahlia","Floral foe with a core shaped to mimic a mask. The core can be thrust forth to bludgeon unwary bugs.","The false mask alone is frightening enough to scare away smaller pests.",20,10,0,"Shellwood"],["shrine-guardian-seth","Shrine Guardian Seth","Eternal defender of Shellwood Shrine. His pin and cymbal show many marks of their use.","He offered fair warning and challenge, a duel in the purest sense. I admire his honour, and his skill.",1,-1,0,"Grand Gate"],["nyleth","Nyleth","Ancient heart of Shellwood, connected to all its living things.","Her presence would once have maintained the wood's fragile order, allowing the safe passage of bugs across its branches.",1,-1,0,"Grand Gate"],["furm","Furm","Burrower that nests in the Bellvein and seeks out hard bells to protect its soft body.","I would very much like to feel their soft fur, if only they weren't so hostile.",25,21,0,"Bellhart"],["winged-furm","Winged Furm","Furred bug beneath a heavy bell. It has grown too large to burrow, but in maturing has developed small wings.","Huge and soft, a fantastic combination ruined by their haunted aggression.",12,7,0,"Bellhart"],["pharlid","Pharlid","Small arachnid found in many crevices and caves throughout Pharloom.","Something in their assault reminds me of my own skill, though their talents are born purely of instinct. My technique is formed from hard training.",20,4,0,"Blasted Steps"],["pharlid-diver","Pharlid Diver","Arachnid that nestles within dark holes in cavern roofs. Pounces on prey from far above.","A smart hunter learns to wait long in ambush, always ready to strike the first blow.",10,1,0,"Underworks"],["shardillard","Shardillard","Devious ambusher that poses as a fossil.","Once roused, the bug will crash its steely shell into walls, floors and foes.",3,1,0,"The Marrow"],["sandcarver","Sandcarver","Shell plated worm that lives beneath pools of shifting sand.","Bursts forth at movement sensed close, and will consume any object or bug careless enough to fall into its maw.",40,-1,0,"Sands of Karak"],["squirrm","Squirrm","Wriggling young grub that lives in darkness.","If allowed the opportunity, these creatures will grow into a form larger and more oppressive.",4,-1,0,"Blasted Steps"],["judge","Judge","Gilded guardian of the Blasted Steps, bearing a cymbal and mallet.","They remorselessly eliminate any pilgrim or passerby deemed impure to their sight. The countless husks, strewn on paths beside them, tell of their conclusive decisions.",15,1,0,"Blasted Steps"],["last-judge","Last Judge","Final arbiter of the Blasted Steps, tasked to ensure only the sinless ever step beyond the Grand Gate.","The huge Judge likely stood through countless generations, never defeated, never wavering in their charge.",1,1,0,"Blasted Steps"],["coral-furm","Coral Furm","Dark-furred bug protecting itself with a spiked coral nut.","Its fur is thick and silky. Sadly, lost to its Haunting, I shall never safely be able to touch it.",15,8,0,"Sands of Karak"],["driznit","Driznit","Nesting creature that fuses its face with sharpened coral.","It is easy to be caught off-guard by the ricocheting trajectory of its flung mask, especially in tight corners.",25,4,0,"Blasted Steps"],["driznarga","Driznarga","Large male Driznit, ferocious and territorial. Fires its heavy coral mask at intruders.","A fine shot with its sharp mask. Its aggression has no ill effect on its aim.",14,6,0,"Sands of Karak"],["pokenabbin","Pokenabbin","Drifting creature with a wide coral mask and hard proboscis to stab its prey.","Passively waits for prey to blunder into its path. A technique that should not necessarily be derided. Whatever is effective is best.",16,5,0,"Sands of Karak"],["conchfly","Conchfly","Small bug that crafts a shell of sharpened coral. Spins its shell at rapid speed to cut through crust and bone.","The way it darts in and out of the ground has an almost playful quality to it. An amusing and effective way to ambush prey.",8,12,0,"Sands of Karak"],["great-conchfly","Great Conchfly","Elder Conchfly crowned with a huge coral horn. Once partnered with a mate, they will rarely be seen alone.","To pair with another is a base instinct, and one that brings some bugs great joy. I once sought similar union, but of my own mates none could match my lifespan.",2,2,0,"Blasted Steps"],["crustcrawler","Crustcrawler","Soft-shelled scrambler encased in coral.","Hidden amongst their tower's matching crust, these smaller bugs would have survived and thrived.",10,4,0,"Sands of Karak"],["crustcrag","Crustcrag","Coral hulk with a dense shell, bred to immense size by the Citadel's Memorium.","Nature distorted... This bug was born tiny and mild. The Citadel deformed it in futile hope it may sustain.",6,2,0,"Memorium"],["kai","Kai","Plump, plentiful drifter of a coral past.","They once teemed around their tower, in numbers immense. It is a rare chance to witness such a bountiful display of life.",10,20,0,"Sands of Karak"],["spinebeak-kai","Spinebeak Kai","Steel horned floater, able to defend itself and its companions.","A critical member of the larger flock. Without them present the Kai would be fast driven to extinction by larger predators.",10,2,0,"Sands of Karak"],["steelspine-kai","Steelspine Kai","Toughened Kai capable of extending sharp spikes from within its shellsack.","Seeming soft, but hiding a sharp surprise. Any larger predator attempting a bite would learn a pointed and painful lesson.",15,3,0,"Sands of Karak"],["yuma","Yuma","Gelatinous coral drifter of simple mind and placid demeanour.","A creature at its most basic. This one is no threat to me, or any other.",16,26,0,"Sands of Karak"],["yumama","Yumama","Large, gelatinous drifter. Chases away threats by hurling its bulk around.","When defeated, it splits into many smaller forms. Yet another remarkable creature of this land before the monarch.",3,3,0,"Sands of Karak"],["karaka","Karaka","Staunch and skilled bladebug of a once flourishing land lost to time.","The core member of a powerful order, trained fearless and faithful. Theirs was a kingdom of warriors, one built upon their blades.",10,18,0,"Sands of Karak"],["kakri","Kakri","Lithe, winged scouts frequently paired with their heavier brethren.","Its training resembles my own, favouring fast strikes and rapid movement. Once a hunter, perhaps?",10,9,0,"Sands of Karak"],["yago","Yago","Wide-masked aerial attacker trained to act as support for its grounded companions while remaining at range.","Not a frontline force, but in my assault upon their tower all emerge to see me stilled.",12,9,0,"Sands of Karak"],["karak-gor","Karak Gor","Heavy, hard-shelled charger relying on weight and strength.","Far tougher for being matched inside their encrusted domain. They must have lived their whole lives within their tower, to command it so.",8,4,0,"Sands of Karak"],["alita","Alita","Leaping hunter of a bygone age. The swiftest of their sect, deftly skilled with spinning foreblades.","In contests of speed against strength, I have seen the swift more often triumphant, a lesson I have taken to my own heart.",6,6,0,"Sands of Karak"],["corrcrust-karaka","Corrcrust Karaka","Overgrown elder, able to spawn burning bubbles from within its coral-cased shell.","This bug's fusion with the crust-growth... It seems intentional, though I imagine the union is far from comfortable.",6,1,0,"Sands of Karak"],["crust-king-khann","Crust King Khann","Hardened warrior lord of a bygone age, able to command the coral crust to his bidding.","For his stern stewardship his legions seemed utterly loyal. For less combative bugs his would have been a hard rule.",1,-1,0,"Sands of Karak"],["watcher-at-the-edge","Watcher at the Edge","Old warrior guarding the border of their domain, stiffened by time and awoken by song.","They held long at their vigil, far beyond the age of their brethren, yet still when roused they swung their blade with remarkable ease.",1,-1,0,"Sands of Karak"],["voltvyrm","Voltvyrm","Coiled nest of charged worms. Assaults intruders with bolts of crackling electricity.","Barely a bug, and possessing only basic thought, yet instinct alone proved enough to turn it deadly.",1,-1,0,"Sands of Karak"],["drapefly","Drapefly","Erratic, flying pest that nests in rags and curtains.","Like fabric somehow sprung to life. Its pelt is perfectly matched to the rags it infests.",30,16,0,"Memorium"],["drapelord","Drapelord","Elder Drapefly grown big from age and consumption. Its heavy body allows it to hit much harder than its younger companions.","Greed will always see some bugs swell above their kin.",4,3,0,"Memorium"],["drapemite","Drapemite","Cloth-covered crawler with sharpened forelimbs. Lives and breeds in dark places.","Pharloom's structures seem almost built for them. The endless corners and cracks, so perfect for mites to burrow and nest.",20,11,0,"Whispering Vaults"],["giant-drapemite","Giant Drapemite","Full-sized mite of the Citadel cloaked in an old curtain.","Few creatures of that Silk stricken place would find nourishment enough to grow so large.",6,2,0,"High Halls"],["underworker","Underworker","Feeble servant of the Underworks with a long twistpin and hard shell.","With all the refuse collapsing throughout their domain, the worker's stiff shell would be essential if they held any hope to survive.",15,6,0,"Underworks"],["underscrub","Underscrub","Drained yet dedicated labourer, wielding a coarse steel brush.","That they ever hoped to keep their domain clean... What futility.",20,7,0,"Underworks"],["undersweep","Undersweep","Uses their steel-bristled pin to scrub the soot from vents and pipes.","Their sharp cleaning implement is as filthy as the rest of the place. They only layer grime on grime.",10,5,0,"Underworks"],["underpoke","Underpoke","Drained worker on the verge of collapse. Consumed by the Haunting, they continue to work far beyond their mortal limits.","They toiled incessantly for the Citadel, their shells bent and greyed, and now the kingdom's curse means not even death can relieve them.",25,8,0,"Underworks"],["underloft","Underloft","Exhausted bug, grown sickly from the smog of the Underworks. The worker's twistpins, once tools of repair, now serve as spun projectiles.","The cost of so much grandeur... Did I peer closely enough into the foundations of my own kingdom?",25,12,0,"Underworks"],["undercrank","Undercrank","Heavy, hard-shelled worker, forever repairing the Citadel's crumbling Underworks.","There seem no ranks in their domain, yet this one has risen above the rest. A station likely gained through intimidation and thuggery.",4,10,0,"Underworks"],["envoy","Envoy","Guide and ofttimes leader within the Citadel's Choir.","Bugs like these crossed the caves to bring me to Pharloom. I cut down many before my capture. Then I had thought them minded and cunning. Now I can see the singular will that haunts them all.",20,72,0,"Choral Chambers"],["choir-pouncer","Choir Pouncer","Agile bug, and one of few hardy pilgrims to have reached the Citadel.","Once one of Pharloom's favoured bugs, and yet their domain and their shells would have been the first to fall to the Haunting.",30,20,0,"Choral Chambers"],["choir-hornhead","Choir Hornhead","Full-grown former pilgrim serving the Citadel.","Did this one grow large thanks to the Citadel's excess, or was its formidable size the reason it ever survived to reach this place?",15,9,0,"Choral Chambers"],["choir-bellbearer","Choir Bellbearer","Winged devout of the Citadel, carrying a brace of gilded bells.","Pharloom proves often the effectiveness of bells as weapons. Never before had I considered them as such.",25,18,0,"High Halls"],["choir-flyer","Choir Flyer","Aerial bug of the Citadel, unarmed but for its short horn.","For this bug to have survived Pharloom's climb it must have teamed with stouter companions. I cannot imagine it succeeding alone.",20,17,0,"Choral Chambers"],["choir-elder","Choir Elder","Aged former pilgrim. Uses their wings to position above threats and crush them under their large shell.","Time allowed their shell to grow thick, all the better for battering their targets.",6,9,0,"Choral Chambers"],["choristor","Choristor","Disciple of the Choir, elevated above other pilgrims, and forced to cowl their face forever more.","Their use of a pin shows hard training. Their use of Silk, unfurled from a spool held close, shows skill far beyond standard bugs.",25,78,0,"Whispering Vaults"],["reed","Reed","Disciple of the Choir, charged to maintain its perfect order, by sharp pin if necessary.","A form well suited for combat, lithe and fast. No surprise it seems to rank so high amongst its cult.",30,26,0,"Choral Chambers"],["grand-reed","Grand Reed","High standing insect of the Choir, bearing a bow. This elite Reed has been trained and fed beyond its smaller fellows.","This bug bears a spool of Silk, which they flail to attack. Though somewhat crude, theirs is a technique much reminiscent of Weavers. I wonder who taught them such a use?",12,6,0,"Choral Chambers"],["choir-clapper","Choir Clapper","Mighty percussive disciple of the Choir, wielding a mallet and a Silk spool to wrap and enhance their attacks.","There is no finesse in its use of Silk. It consumes its slim supply only to amplify its force.",3,3,0,"High Halls"],["clawmaiden","Clawmaiden","Puppet servant of the Citadel, suspended on strings of Silk. An early form of automaton, requiring extensive Silk to maintain its service.","If given a chance, this one will steal Silk from any significant source, including my own shell.",10,10,0,"High Halls"],["memoria","Memoria","Learned disciple of the Choir charged to maintain the Citadel's Memorium.","From the outset, theirs was a hopeless task. Those wild lands could never be replicated within a space so artificial.",2,2,0,"Memorium"],["minister","Minister","Gold ranked disciple of the Choir and direct servant to the Citadel's Conductors.","The lethality of these bugs is unexpected. Their bodies were never built for combat. The Haunting has altered their nature dramatically.",15,6,0,"High Halls"],["maestro","Maestro","Choir commander of the High Halls, able to summon and command cogflies at a flick of their baton.","Once they summoned song from their subjects. Now they rise only to command an end to those unstrung.",6,5,0,"High Halls"],["second-sentinel","Second Sentinel","Cogwork knight of Pharloom, once protector of its pilgrims, and master of the scissor blade.","The talent and intelligence of this construct goes far beyond others I have witnessed. They seem less built as a tool to serve than an attempt at life itself.",1,-1,0,"Choral Chambers"],["dreg-husk","Dreg Husk","Remains of a Citadel bug possessed by Silk dregs. The husk will lash out wildly with the many sharp pins caught inside its thread.","There is old anguish bound upon these threads, the result of countless cruel procedures.",8,12,0,"Whiteward"],["dregwheel","Dregwheel","Shell of a small bug possessed by Silk dregs. The husk will stretch its Silk to form a crude, crushing wheel.","Living Silk commanding a dead shell... An affront to nature, and one all too common across Pharloom.",8,14,0,"Whiteward"],["surgeon","Surgeon","Cruel physician of Whiteward, responsible for operations and modifications on the Citadel's bugs.","Their procedures with Silk may have prolonged life within the Citadel, but they unknowingly gifted many minds to the monarch.",3,3,0,"Whiteward"],["mortician","Mortician","Altered servant of the Citadel's Whiteward, responsible for the cremation of husks and the recycling of Silk from their shells.","It lies low to the ground, perhaps out of reverence for its task, but can spring up suddenly to attack. Its shear makes for a deadly weapon with surprising reach.",10,6,0,"Whiteward"],["the-unravelled","The Unravelled","Tormented will of countless husks made manifest in a pit of Silk dregs.","The souls of so many bugs, obsessed with Silk, consumed by it. Their pain shall forever remain in that pit. Even I do not possess strength enough to cleanse it.",1,1,0,"Whiteward"],["cogwork-underfly","Cogwork Underfly","Small automaton built to work, without complaint, in the scorching heat of the Underworks' Cauldron.","It is no wonder these constructs were cast. No mortal bug would last long inside that scorching place. Even my shell struggles to withstand its heat.",25,8,0,"Underworks"],["cogwork-hauler","Cogwork Hauler","Small automaton with a shielded shell, intended to carry loads of dangerous flintflame.","Born and built only to work until time stiffens its limbs. Perhaps it is mercy this construct knows nothing of the freedom it lacks.",12,18,0,"Underworks"],["cogwork-crawler","Cogwork Crawler","Automaton built in the shape of a scuttling bug. Its back contains retractable pins, intended to cut song cylinders free of any obstruction.","Its form is certainly based on bugs found outside the Citadel. In my own craftwork, I too often look to nature for inspiration.",15,-1,0,"Cogwork Core"],["cogworker","Cogworker","Flighted automaton, responsible for repairing and extending the Core.","More effective an opponent than would be guessed. The precarity of its winding domain can make even its simple assault a challenge.",15,4,0,"Cogwork Core"],["cogwork-spine","Cogwork Spine","Spherical, winged automaton housing many sharp spikes.","I cannot decipher its function to the greater Core. Is it built for defence? If so, its passivity seems far from optimal.",10,1,0,"Cogwork Core"],["cogwork-choirbug","Cogwork Choirbug","Bug forged of iron, rotor and cog. The automaton works tirelessly to maintain the Core that houses it.","Its core is filled with fine mechanisms, but that alone should not produce such a convincing mimic of life. Silk must also be used to animate this artifice, though exactly how I am not sure.",20,7,0,"Cogwork Core"],["cogwork-cleanser","Cogwork Cleanser","Steam shooting automaton, forged to clean the Cogwork Core and keep it free of infestation.","An inspired use of steam. I must remember its construction when designing future tools.",12,4,0,"Cogwork Core"],["cogwork-defender","Cogwork Defender","Cogwork construct forged primarily for the Core's protection. Bears a shield and poke-pin, and possesses a lethal understanding of their use.","It has no true mind, and yet fights effectively, adjusting its strategy to my movements. Where exactly are its thoughts written?",8,1,0,"Cogwork Core"],["cogwork-clapper","Cogwork Clapper","Rare automaton intended to perform the ringing of bells and cymbals in the depths of the Core.","I have not yet seen the bell this automaton is designed to ring, nor do I ever wish to hear it. Such a clamour would no doubt be unpleasant to experience.",1,1,0,"Cogwork Core"],["cogwork-dancers","Cogwork Dancers","Automatons of impeccable construction, welcoming entrants to their chamber with a display of deadly dance.","Two cogwork bugs, and yet the soul seemed singular? A sad, yet masterful imitation of life, imbued inside shells of iron.",1,1,0,"Cogwork Core"],["vaultborn","Vaultborn","Young acolyte raised in the darkest vaults, destined to ascend to the rank of Scrollreader.","In entering their domain, I freed these bugs to infest the greater vaults. They are a nuisance, and I have only myself to blame.",20,-1,0,"Whispering Vaults"],["lampbearer","Lampbearer","Disciple of the Whispering Vaults, tasked to navigate its dim recesses to retrieve old scrolls.","An essential bug if one ever hoped to navigate that dark maze of stacks and scrolls.",20,3,0,"Whispering Vaults"],["scrollreader","Scrollreader","Gilded servant of the Whispering Vaults, born to read and recall the near endless scrolls of prayer.","Did they ever truly understand those inscrutable scrolls? Or is it all merely pretence, an endless act to maintain their order's station within the Citadel?",15,3,0,"Whispering Vaults"],["vaultkeeper","Vaultkeeper","High caste bug, responsible for delivering sermons and leading prayer for those beyond the walls of the Whispering Vaults.","Most likely this one's true charge was to root out and condemn those not seen as sufficiently fervent.",10,7,0,"Whispering Vaults"],["trobbio","Trobbio","Haughty thespian convinced that only dazzling performance can raise Pharloom from the throes of death.","His desire to see Pharloom saved may have been well intentioned, but he seemed quite happy for others to die upon the stage in pursuit of his goal.",1,1,0,"Whispering Vaults"],["tormented-trobbio","Tormented Trobbio","Depressed thespian, consumed by the melancholy of a collapsing world.","This one chose to embrace the doom to come. I shall not share such easy surrender.",1,-1,0,"Whispering Vaults"],["penitent","Penitent","Humbled prisoner serving their sentence for sin committed within the Citadel.","All are haunted here, the jailers and the jailed. Do they realise they will never leave this place? Or how long they have stayed already?",8,6,0,"The Slab"],["puny-penitent","Puny Penitent","Small bug, shackled and cowled for sin committed within the Citadel.","Their thick shroud leaves them sightless, yet it seems to matter little. They have no care for their own safety, wishing only to charge at those they sense as sinful.",6,2,0,"The Slab"],["freshfly","Freshfly","Infant fly, freshly hatched. At this age the soft, blind fly is little more than a bother.","The less these gruesome bugs breed, the better.",20,115,0,"The Slab"],["scabfly","Scabfly","Sticky young fly, born and grown in service to the Slab.","Foul creatures birthed into servitude. Their plight elicits no sympathy from me.",15,14,0,"The Slab"],["guardfly","Guardfly","Starved servant of the Slab, bearing a hooked longpin.","The smell from these jailers overwhelms my senses. I strongly doubt they have ever thought to bathe.",10,14,0,"The Slab"],["wardenfly","Wardenfly","Heavy, hairy jailer responsible for capturing sinners and punishing prisoners.","Disgusting both in manner and stench. I feel no remorse to see them felled.",8,7,0,"The Slab"],["broodmother","Broodmother","Mad matriarch of the Slab rarely seen outside her warren. From her all jailers are born and bred.","With this one vanquished, I hope to have sped the end for that jail and its distasteful order.",1,1,0,"The Slab"],["driftlin","Driftlin","Gentle glider of Mount Fay. Its downy wings and cowl allow it to resist even the most cutting cold.","This one would make a perfect pet, but for the freezing temperatures it requires for comfort.",20,24,0,"Mount Fay"],["mnemonid","Mnemonid","Flighted creature formed from coldshard. If shattered it will quickly reform.","The coldshard, even when destroyed it remembers its former shape. A remarkable material, and perhaps even more astonishing there seems life contained within it.",10,13,0,"Mount Fay"],["mnemonord","Mnemonord","Huge flighted creature formed from coldshard.","This larger form carries so much weight it can barely move from its place.",3,-1,0,"Mount Fay"],["servitor-ignim","Servitor Ignim","Small construct built by Weavers past, brought to life through Silk runes threaded within.","Though the Weavers have long passed from Pharloom, this servant still performs its function.",8,5,0,"Weavenest Atla"],["servitor-boran","Servitor Boran","Broken construct built by Weavers past, able to fire a focused beam of silklight to carve halls and chambers through ice and bone.","The servitor has been heavily damaged by time and the elements. Its actions have grown erratic. It seems no longer able to discern friend from foe.",5,2,0,"Mount Fay"],["winged-lifeseed","Winged Lifeseed","Mindless sack filled with Plasmium. When broken the Plasmium can be consumed for its temporary benefits to health.","My unique shell can resist the darker deformations of this substance, but even I have limits...",8,-1,0,"Bone Bottom"],["plasmid","Plasmid","Mutated young worm infected with Plasmium. The new form displays potent regenerative skill.","Pharloom shall quickly learn the curse of this substance. What benefits it provides can be swiftly outweighed.",15,-1,0,"Wormways"],["plasmidas","Plasmidas","Large worm mutated heavily by Plasmium. The creature has become fused to the roof of its cave, no longer able to move freely.","In my home caves, when once this substance was allowed to flourish, I saw similar aberrations. This is wonder tainted strong with revulsion.",6,-1,0,"Wormways"],["plasmified-zango","Plasmified Zango","Husk of an alchemist's assistant granted false life by Plasmium.","He carelessly seeded these caves with that cursed substance... His final fate seems fair reward for those efforts, yet I feel some sympathy. It is an alluring power.",1,-1,0,"Wormways"],["leaf-glider","Leaf Glider","Fine winged flyer that survives in flocks.","So light they can rest atop still water's surface. An elegant bug indeed.",12,-1,0,"Lost Verdania"],["leaf-roller","Leaf Roller","Pointed scurrier posing as plant life.","Simple. Graceful. Another fine bug lost forever from these lands.",10,-1,0,"Lost Verdania"],["pendra","Pendra","Flighty insect that lives beside still waters.","Though generally passive, their sharp masks can cause injury if carelessly blundered into.",10,-1,0,"Lost Verdania"],["pendragor","Pendragor","Heavy insect that lives near large bodies of water. Its weighty body is best avoided.","When they do not hinder my path, I find their simple motion rather pleasant.",10,-1,0,"Lost Verdania"],["nuphar","Nuphar","Predatory plant with a powerful jaw shaped to resemble a lily pad.","A snapping surprise on first encounter, though one easily avoided once aware.",6,-1,0,"Lost Verdania"],["cloverstag","Cloverstag","Placid native of Verdania. Its hide closely mimics the flora of its territory.","An impressive act of mimicry. To match so closely with its land, their clover caves must have sustained through generations uncounted.",10,-1,0,"Lost Verdania"],["palestag","Palestag","Fabled first Cloverstag of Verdania's wilds. Commands the grass and leaves to aid its attack.","Myth made real in memory. The creature seemed completely at one with the flora around it. Did it ever truly exist as I have seen it?",1,-1,1,"Lost Verdania"],["kindanir","Kindanir","Child of Verdania, fully capable to fight despite its young age.","Fierce and fast, and defending their lands even from birth. These are children to be proud of.",10,-1,0,"Lost Verdania"],["verdanir","Verdanir","Darting warrior with sharpened forelimbs and heightened senses.","They rarely relax, always alert for potential danger, even deep in their own territory. To defeat them my focus must match their own.",10,-1,0,"Lost Verdania"],["escalion","Escalion","Blindingly fast, winged warrior able to launch pointed pinions from its forelimbs.","Born with many tools I would once have desired for myself. Fortunately, I have trained hard around those limits.",10,-1,0,"Lost Verdania"],["clover-dancers","Clover Dancers","Dual princes of old Verdania, beloved by their subjects for their grace and for the ballet of death they delivered upon outsiders.","For one to love another so similar to themselves, is that selfless or vain?",1,-1,0,"Lost Verdania"],["shadow-creeper","Shadow Creeper","Shell-plated worm found only in the deepest depths. Seems to survive despite consuming no food or liquid.","A creature long familiar to me. I suspect that no matter how far I travel, if I descend deep enough they will always be there.",16,2,0,"The Abyss"],["shadow-charger","Shadow Charger","Bulky worm of the deepest depths. Lives in tight crevices and uses its weighty body to batter.","These ones grow large, yet I have never observed them eating, or sleeping. They seem such simple bugs... but I suspect they are not truly our cousins.",6,1,0,"The Abyss"],["gloomsac","Gloomsac","Tiny empty creature, barely a bug. Swallows its prey whole and sucks their nutrients until nothing remains.","This one disturbs me... There is something in its simplicity. Do I almost feel fear?",15,3,0,"The Abyss"],["gargant-gloom","Gargant Gloom","Enormous tubular beast uniquely suited to living close to the void below.","Amazingly, the creature carries the void's black liquid in its stomach, violently spraying it forth if threatened.",4,-1,0,"The Abyss"],["void-tendrils","Void Tendrils","Lashing fragments of pure darkness, shaped into sharpened tentacles.","The void that will claim all things... In the barbed forms it chooses its nature can be seen clear.",1,-1,0,"The Abyss"],["void-mass","Void Mass","Dense knot of husks bound tight by void soaked Silk.","Silk and shells corrupted. That void seeks now to claim this land whole. These poor shells are only the beginning.",8,1,0,"Sinner's Road"],["summoned-saviour","Summoned Saviour","Mass of old masks swollen and animated by writhing void.","A creature born of a bug's desperate hope for strength. Few possess the skill to call the void, and of those that can, none possess the means to tame it.",1,-1,0,"Bone Bottom"],["wingmould","Wingmould","False fly with a rune etched shell. A tortured mix of soul and void is caged within.","A crude construct of my father's fallen domain. Only a fool believes that void can be fashioned to do their bidding.",10,-1,0,""],["garpid","Garpid","Sightless burrower that reacts violently to the slightest sound.","A common enough bug, though not to be underestimated. The acuteness of their other senses more than makes up for their lack of vision.",30,-1,0,""],["imoba","Imoba","Slow drifting bug with a heavy top shell. The bug reacts little to threats, even those that could claim its life.","The poor creature has lived a life too calm and coddled. It would not fare well in the world beyond its walls.",4,-1,0,""],["skrill","Skrill","Common crawler that lives beneath sand.","This surface dweller is free of Silk. Its nature remains its own. The monarch's influence must only have stretched below it.",10,-1,0,""],["bell-eater","Bell Eater","Long dormant centipede, awoken and enraged by Pharloom's crumbling collapse.","A monster in the classic form of tales from youth. Its slaying was done as much by my fierce travelling companion as by myself.",1,1,0,"Bellhart"],["huge-flea","Huge Flea","Oversized bug, briefly consumed by anger after its long time caged.","I would not have guessed so large and marvellous a flea existed. I am pleased it saw sense before I had to strike a killing blow.",1,1,0,"Memorium"],["shakra","Shakra","Warrior cartographer of a tribe from Pharloom's edge. Her skills in battle could challenge the kingdom's best.","She has lived a mere fraction of my lifetime and yet her rings prove a ferocious match. As gifted a warrior as I have ever encountered, and one I am fortunate to call a friend.",1,-1,1,"Greymoor"],["garmond-and-zaza","Garmond & Zaza","Vigorous old knight and their noble companion, working together to see their lands cut free from haunted madness.","They too seek the spectre at the Haunting's heart, though I fear that foe would pose a challenge beyond their mortal limits.",1,-1,1,"Whispering Vaults"],["lost-garmond","Lost Garmond","Old knight consumed by black thread.","A tragic fate for a once honourable bug. Those void soaked threads... Their physical might is nothing compared to the corruption they wreak upon a soul.",1,-1,1,"Blasted Steps"],["pinstress","Pinstress","Blade maiden of a once renowned warrior sect, survived long beyond the rest of her order.","I like her. For her willingness to teach and her spirit still strong, despite a long age spent solitary... she has my respect.",1,-1,0,"Mount Fay"],["widow","Widow","Crazed fanatic able to guide Pharloom's haunted Silk by music played upon it.","Her body seemed a Weaver's, but her mask had been forcibly removed, and her own Silk was bound useless by heavy pins lodged through her spine.",1,1,0,"Bellhart"],["first-sinner","First Sinner","Ancient Weaver condemned for a transgression lost to time.","This one's husk held a masterful talent, to weave Silk into blazing runes. Throughout my life, I have seen runes woven for many tasks. Was she the first to hone such skills?",1,-1,0,"The Slab"],["phantom","Phantom","Mournful creature tasked alone to expel the Citadel's choking refuse. Their talent with a longpin is unmatched.","Though grey with age, their frayed form suggested a being strung from Silk, one who welcomed a decisive end in combat over a slow decline.",1,1,0,"Bilewater"],["lace","Lace","Manic fencer who delights in battle.","A bug born entirely of thread. Much Silk would have been needed to see her sustained. A fragile form of life, but life nonetheless.",2,2,0,"Deep Docks"],["grand-mother-silk","Grand Mother Silk","Monarch of Pharloom, and the primal source of Silk.","Heart of the Haunting, long lulled to slumber and desperate to wake. The higher being's threads stretched throughout Pharloom, snaring its bugs and driving them to madness and discord.",1,2,0,"The Cradle"],["lost-lace","Lost Lace","Silk-spun child possessed by the void.","To quell the mother's rage, and see this kingdom saved, I will claim her back. This one... the dark shall not take.",1,-1,1,"The Abyss"]];</script>

<style>
.mk-bar { position: fixed; z-index: 90; left: 50%; bottom: var(--sp-2); transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1) var(--sp-3); width: max-content; max-width: calc(100vw - var(--sp-4)); padding: var(--sp-2) var(--sp-3); background: color-mix(in oklab, var(--scene-bg) 94%, transparent); border: 1px solid var(--line-panel); font-family: var(--font-num); font-size: var(--fs-xs); color: var(--muted); }
.mk-bar b { color: var(--label); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; font-size: var(--fs-2xs); }
.mk-bar button { padding: var(--sp-1) var(--sp-2); border: 1px solid var(--line-ctl); color: var(--ink-2); font: inherit; }
.mk-bar button[aria-pressed="true"] { color: var(--ink-strong); border-color: var(--accent-line); background: var(--picked); }
.mk-note { flex-basis: 100%; text-align: center; color: var(--ink-2); }
html.is-framed body { background: var(--scene-bg); }
.mk-phone { display: block; margin: var(--sp-4) auto calc(var(--sp-16) * 2); width: 390px; height: calc(100vh - var(--sp-16) * 2 - var(--sp-8)); border: 1px solid var(--line-panel); }
html.is-inner .mk-bar { display: none; }
.page { padding-top: var(--sp-8); padding-bottom: calc(var(--sp-16) * 2.5); }
.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.lbl { font-size: var(--fs-2xs); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--label); }

/* The bar under the count: complete · seen · not seen, as three lengths. */
.tri { display: flex; height: 4px; width: 100%; background: var(--ring-track); }
.tri i { display: block; }
.tri .d { background: var(--accent); box-shadow: var(--glow); }
.tri .s { background: color-mix(in oklab, var(--silk-rim) 45%, transparent); }
.leg { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-1) var(--sp-4); font-size: var(--fs-xs); color: var(--muted); }
.leg span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: var(--sp-1); vertical-align: middle; }
.leg .d::before { background: var(--accent); } .leg .s::before { background: var(--silk-rim); opacity: .6; } .leg .x::before { border: 1px dashed var(--line-ctl); }

/* Two small icon toggles instead of four words. */
.tg { display: inline-flex; border: 1px solid var(--line-ctl); }
.tg button { display: grid; place-items: center; width: var(--ctl-sm); height: var(--ctl-sm); color: var(--muted); }
.tg button[aria-pressed="true"] { color: var(--ink-strong); background: var(--picked); }
.tools { display: flex; align-items: center; gap: var(--sp-3); }

/* A */
.a-head { display: grid; justify-items: center; gap: var(--sp-2); width: min(420px, 100%); margin: var(--sp-3) auto 0; }
.a-head .big { display: flex; align-items: baseline; gap: var(--sp-2); }
.a-head .big b { font-size: var(--fs-2xl); color: var(--ink-strong); } .a-head .big i { font-style: normal; color: var(--muted); }
.a-bar { display: flex; justify-content: space-between; align-items: center; margin: var(--sp-6) 0 var(--sp-2); }
.lean { display: grid; justify-items: center; gap: var(--sp-2); text-align: center; }
.lean .kbadge { margin-top: calc(var(--sp-6) * -1); position: relative; padding: 0 var(--sp-2); background: var(--scene-floor); font-size: var(--fs-sm); color: var(--ink-strong); }
.lean .kbadge i { font-style: normal; color: var(--muted); }
.lean h3 { margin: var(--sp-1) 0 0; }
.lean .desc { margin: 0; color: var(--ink-2); font-size: var(--fs-sm); text-wrap: pretty; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-2); margin-top: var(--sp-4); padding-top: var(--sp-4); border-top: 1px solid var(--line); }
.chip { display: grid; justify-items: center; gap: var(--sp-1); font-size: var(--fs-2xs); color: var(--muted); text-align: center; }
.chip .hj-ring { width: 44px; }
.chip b { color: var(--ink-2); font-weight: 400; }

/* B */
.b-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-8); align-items: center; margin: var(--sp-4) 0 var(--sp-8); padding-bottom: var(--sp-6); border-bottom: 1px solid var(--line); }
.memento { position: relative; display: grid; place-items: center; width: 150px; aspect-ratio: 1; border-radius: 50%; }
.memento::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--d) * 360deg), color-mix(in oklab, var(--silk-rim) 45%, transparent) 0 calc(var(--s) * 360deg), var(--ring-track) 0);
  -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 6px), var(--ring-mask) calc(100% - 5px)); mask: radial-gradient(closest-side, transparent calc(100% - 6px), var(--ring-mask) calc(100% - 5px)); }
.memento div { display: grid; justify-items: center; line-height: 1.1; }
.memento b { font-size: var(--fs-2xl); color: var(--ink-strong); } .memento i { font-style: normal; color: var(--muted); font-size: var(--fs-sm); }
.hunts h3 { margin: 0 0 var(--sp-3); }
.hunt-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
.hunt { display: grid; justify-items: center; gap: var(--sp-1); padding: var(--sp-3) var(--sp-2); border: 1px solid var(--line); text-align: center; }
.hunt .hj-ring { width: 72px; margin-bottom: var(--sp-1); }
.hunt b { font-family: var(--font-title); font-weight: 400; color: var(--ink-strong); font-size: var(--fs-sm); }
.hunt span { font-size: var(--fs-xs); color: var(--muted); }
.hunt em { font-style: normal; font-size: var(--fs-xs); color: var(--ink-2); }
.b-bar { display: flex; justify-content: flex-end; margin-bottom: var(--sp-2); }

/* C */
.c-top { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--sp-2); margin: var(--sp-4) 0 var(--sp-8); }
.tile { display: grid; justify-items: center; gap: var(--sp-1); padding: var(--sp-3) var(--sp-1); border: 1px solid var(--line); text-align: center; }
.tile .mini { position: relative; width: 52px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.tile .mini::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--f) * 360deg), var(--ring-track) 0); -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 3px), var(--ring-mask) calc(100% - 2px)); mask: radial-gradient(closest-side, transparent calc(100% - 3px), var(--ring-mask) calc(100% - 2px)); }
.tile .mini img { width: 70%; }
.tile span { font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink-2); line-height: 1.3; }
.tile em { font-style: normal; font-size: var(--fs-xs); color: var(--muted); }
.tile.is-first { border-color: var(--line-panel); }
.tile.is-first .mini { width: 52px; } .tile.is-first b { font-size: var(--fs-xl); color: var(--ink-strong); }

@media (max-width: 899px) {
  .b-hero { grid-template-columns: 1fr; justify-items: center; gap: var(--sp-4); }
  .memento { width: 120px; }
  .hunt-row { grid-template-columns: repeat(4, 72px); overflow-x: auto; justify-content: start; }
  .hunt { padding: var(--sp-2) 0; border: 0; } .hunt .hj-ring { width: 56px; } .hunt span { display: none; }
  .c-top { grid-template-columns: repeat(3, 1fr); }
  .chips { grid-template-columns: repeat(5, 1fr); }
}
</style>

<script>
(function () {
  const DEF = { v: 'a', w: '1440' };
  const q = new URLSearchParams(location.search);
  const st = Object.fromEntries(Object.keys(DEF).map((k) => [k, q.get(k) || DEF[k]]));
  const inner = q.has('inner'), html = document.documentElement;
  const E = JJ.map(([id, name, desc, note, need, have, opt, area]) => ({ id, name, desc, note, need, have, opt, area: area || 'Elsewhere' }));
  const byId = Object.fromEntries(E.map((e) => [e.id, e]));
  const done = E.filter((e) => !e.opt && e.have >= e.need).length;
  const seen = E.filter((e) => e.have >= 0).length, all = E.length;
  const state = (e) => e.have < 0 ? 'unseen' : e.have >= e.need ? 'done' : 'seen';
  const ring = (e, cls = '') => '<span class="hj-ring is-' + state(e) + cls + '" style="--f:' + Math.max(0, Math.min(1, e.have / e.need)).toFixed(3) + '"><img src="assets/icons/journal/' + e.id + '.webp" alt=""></span>';
  let sel = byId[NEAR[0].id];
  const areas = {}; for (const e of E) (areas[e.area] = areas[e.area] || []).push(e);
  const order = Object.entries(areas).sort(([a, x], [b, y]) => (a === 'Elsewhere') - (b === 'Elsewhere') || y.filter((e) => state(e) !== 'done').length - x.filter((e) => state(e) !== 'done').length);
  const grid = (n = 3) => '<div class="hj-shelf">' + order.slice(0, n).map(([a, xs]) => '<section class="hj-area-group"><h3 class="ct-h"><span>' + a + '</span><span class="hj-area-n">' + xs.filter((e) => state(e) === 'done').length + '/' + xs.length + '</span></h3><ul class="hj-grid">' +
    xs.filter((e) => state(e) !== 'done').map((e) => '<li><button type="button" class="hj-cell' + (e === sel ? ' is-picked' : '') + '" data-id="' + e.id + '">' + ring(e) + '</button></li>').join('') + '</ul></section>').join('') + '</div>';
  const I_MISS = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6" stroke-dasharray="2 2"/></svg>';
  const I_ALL = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5" fill="currentColor"/></svg>';
  const I_AREA = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h5M2 12h12"/></svg>';
  const I_BOOK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="3" height="3"/><rect x="6.5" y="2" width="3" height="3"/><rect x="11" y="2" width="3" height="3"/><rect x="2" y="6.5" width="3" height="3"/><rect x="6.5" y="6.5" width="3" height="3"/><rect x="11" y="6.5" width="3" height="3"/><rect x="2" y="11" width="3" height="3"/><rect x="6.5" y="11" width="3" height="3"/></svg>';
  const tools = '<div class="tools"><span class="tg" role="group"><button aria-pressed="true" title="What\'s missing">' + I_MISS + '</button><button aria-pressed="false" title="Everything">' + I_ALL + '</button></span><span class="tg" role="group"><button aria-pressed="true" title="By area">' + I_AREA + '</button><button aria-pressed="false" title="Journal order">' + I_BOOK + '</button></span></div>';
  const lean = (e, chips) => '<div class="lean">' + ring(e, ' hj-big') + '<span class="kbadge n">' + Math.max(0, e.have) + '<i>/' + e.need + '</i></span><h3 class="inv-name">' + (e.have < 0 ? '???' : e.name) + '</h3><p class="lbl">' + e.area + '</p>' + (e.have < 0 ? '' : '<p class="desc">' + e.desc + '</p>') + '</div>' + (chips ? chipRow() : '');
  const steps = (s) => s.replace(' rooms away', '').replace('in your room', 'here');
  const chipRow = () => '<div><p class="lbl" style="margin-top:var(--sp-6)">Closest to your bench</p><div class="chips" style="border:0;margin-top:0;padding-top:var(--sp-2)">' + NEAR.slice(0, 5).map((n) => '<button type="button" class="chip" data-id="' + n.id + '">' + ring(byId[n.id]) + '<b>' + steps(n.steps) + '</b></button>').join('') + '</div></div>';
  const NOTES = {
    now: 'Today: the count in words, four word buttons, the entry\'s long pane and ten closest in text with a paragraph under them.',
    a: 'A · quiet: the count as one figure over a bar (complete, seen, not seen) with three dots for a legend; the switches as two small icon toggles; the entry as its ring with the kills on it, name, area and description; the five closest as portraits with how many rooms.',
    b: 'B · next hunts: the Memento as a large ring (complete, seen) beside the four closest missing as cards (portrait, name, rooms, kills left); the grid full width below, and the entry opens only when you tap one.',
    c: 'C · areas at a glance: the Memento and every area as a tile with its ring and count, the most missing first; a tap goes to that area in the grid; the lean entry beside it.' };
  function render() {
    const m = document.getElementById('mk'); let h = '';
    if (st.v === 'now') { location.href = 'index.html#view=journal'; return; }
    if (st.v === 'a') {
      h = '<div class="a-head"><p class="big n" style="margin:0"><b>' + done + '</b><i>/230</i></p><p class="lbl" style="margin:0">for the Hunter\'s Memento</p><div class="tri"><i class="d" style="flex:' + done + '"></i><i class="s" style="flex:' + (seen - done) + '"></i><i style="flex:' + (all - seen) + '"></i></div>' +
        '<div class="leg"><span class="d">' + done + ' complete</span><span class="s">' + (seen - done) + ' seen</span><span class="x">' + (all - seen) + ' not seen</span></div></div>' +
        '<div class="hj-body"><div><div class="a-bar"><span></span>' + tools + '</div>' + grid() + '</div><aside class="hj-detail" style="position:static;max-height:none">' + lean(sel, true) + '</aside></div>';
    }
    if (st.v === 'b') {
      h = '<div class="b-hero"><div class="memento n" style="--d:' + (done / 230) + ';--s:' + (seen / all) + '"><div><b>' + done + '</b><i>/230</i><span class="lbl">Memento</span></div></div>' +
        '<div class="hunts"><h3 class="ct-h">Closest to your bench</h3><div class="hunt-row">' + NEAR.slice(0, 4).map((n) => '<button type="button" class="hunt" data-id="' + n.id + '">' + ring(byId[n.id]) + '<b>' + n.name + '</b><em>' + n.steps + '</em><span>' + n.left + ' to go</span></button>').join('') + '</div></div></div>' +
        '<div class="b-bar">' + tools + '</div>' + grid();
    }
    if (st.v === 'c') {
      h = '<div class="c-top"><div class="tile is-first"><div class="mini" style="--f:' + (done / 230) + '"></div><b class="n">' + done + '<i class="u" style="font-style:normal;color:var(--muted);font-size:var(--fs-sm)">/230</i></b><span>Memento</span></div>' +
        order.map(([a, xs]) => { const d = xs.filter((e) => state(e) === 'done').length; const face = xs.find((e) => state(e) !== 'unseen') || xs[0];
          return '<button type="button" class="tile"><div class="mini" style="--f:' + (d / xs.length) + '"><img src="assets/icons/journal/' + face.id + '.webp" alt=""></div><span>' + a + '</span><em class="n">' + d + '/' + xs.length + '</em></button>'; }).join('') + '</div>' +
        '<div class="hj-body"><div><div class="a-bar" style="margin-top:0"><span></span>' + tools + '</div>' + grid(2) + '</div><aside class="hj-detail" style="position:static;max-height:none">' + lean(sel, false) + '</aside></div>';
    }
    m.innerHTML = h;
  }
  const url = (over) => '?' + new URLSearchParams(Object.assign({}, st, over)).toString();
  if (st.w === '390' && !inner) { html.classList.add('is-framed'); document.querySelector('.page').remove(); const f = document.createElement('iframe'); f.className = 'mk-phone'; f.src = location.pathname + url({ inner: 1 }); document.body.prepend(f); }
  if (inner) html.classList.add('is-inner');
  for (const b of document.querySelectorAll('.mk-bar button')) b.setAttribute('aria-pressed', String(st[b.dataset.key] === b.dataset.val));
  document.getElementById('note').textContent = NOTES[st.v];
  if (document.getElementById('mk')) render();
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.mk-bar button'); if (b) { if (b.dataset.val === 'now') { open('index.html#view=journal'); return; } location.search = url({ [b.dataset.key]: b.dataset.val }); return; }
    const p = e.target.closest('[data-id]'); if (p) { sel = byId[p.dataset.id]; render(); }
  });
})();
</script>
</body>
