<style>
.mk-bar { position: fixed; z-index: 90; left: 50%; bottom: var(--sp-2); transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1) var(--sp-3); width: max-content; max-width: calc(100vw - var(--sp-4)); padding: var(--sp-2) var(--sp-3); background: color-mix(in oklab, var(--scene-bg) 94%, transparent); border: 1px solid var(--line-panel); font-family: var(--font-num); font-size: var(--fs-xs); color: var(--muted); }
.mk-bar b { color: var(--label); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; font-size: var(--fs-2xs); }
.mk-bar button { padding: var(--sp-1) var(--sp-2); border: 1px solid var(--line-ctl); color: var(--ink-2); font: inherit; }
.mk-bar button[aria-pressed="true"] { color: var(--ink-strong); border-color: var(--accent-line); background: var(--picked); }
.mk-grp { display: inline-flex; align-items: center; gap: var(--sp-1); }
.mk-sep { width: 1px; align-self: stretch; background: var(--line); }
.mk-note { flex-basis: 100%; text-align: center; color: var(--ink-2); }
html.is-framed body { background: var(--scene-bg); }
.mk-phone { display: block; margin: var(--sp-4) auto calc(var(--sp-16) * 2); width: 390px; height: calc(100vh - var(--sp-16) * 2 - var(--sp-8)); border: 1px solid var(--line-panel); }
html.is-inner .mk-bar { display: none; }
.page { padding-top: var(--sp-8); padding-bottom: calc(var(--sp-16) * 2.5); }

/* Shared */
.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-strong); font-weight: 600; }
.n i { font-style: normal; font-weight: 400; color: var(--muted); font-size: 0.75em; }
.total { display: grid; justify-items: center; gap: var(--sp-1); margin-bottom: var(--sp-6); text-align: center; }
.total b { font-family: var(--font-num); font-size: var(--fs-hero); line-height: 1; color: var(--ink-strong); }
.total b .u { font-size: var(--fs-2xl); }
.total span { font-size: var(--fs-sm); color: var(--muted); }
.pips { display: flex; flex-wrap: wrap; gap: 3px; }
.pips i { width: var(--diamond); height: var(--diamond); transform: rotate(45deg); border: 1px solid var(--accent-line); }
.pips i.on { background: var(--accent); border-color: var(--accent); }
.ico { width: 28px; height: 28px; object-fit: contain; }
.ico.miss { filter: var(--missing-soft); opacity: var(--missing-soft-opacity); }
.rows { display: grid; }
.r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-3); align-items: baseline; padding: var(--sp-1) var(--sp-2); border-bottom: 1px solid var(--line-row); font-size: var(--fs-sm); color: var(--ink); }
.r span { font-size: var(--fs-xs); color: var(--muted); }
.r.got { color: var(--muted); }
.r.got::before { content: '✓ '; color: var(--good); }
.road { display: grid; gap: var(--sp-2); padding: var(--sp-4) var(--sp-6); margin-bottom: var(--sp-8); border-left: 2px solid var(--accent); background: var(--picked); }
.road h3 { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--ink-strong); letter-spacing: var(--track-title); display: flex; justify-content: space-between; }
.road ol { display: grid; gap: var(--sp-1); counter-reset: s; font-size: var(--fs-sm); }
.road li { display: flex; justify-content: space-between; gap: var(--sp-3); color: var(--ink-2); counter-increment: s; }
.road li::before { content: counter(s); font-family: var(--font-num); font-weight: 600; color: var(--ink-strong); width: var(--sp-4); }
.road li > :first-child { flex: 1; }
.road li.cur { color: var(--ink-strong); }

/* A · the sibling's ledger: the total, then one row per category with its pieces as pictures or
   pips, the count and the disclosure; open a row for its list. */
.a-rows { max-width: var(--column); margin: 0 auto; border-top: 1px solid var(--line-row); }
.a-row { border-bottom: 1px solid var(--line-row); }
.a-head { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto auto; align-items: center; gap: var(--sp-4); width: 100%; min-height: var(--sp-12); padding: var(--sp-2) 0; text-align: left; }
.a-head .nm { font-size: var(--fs-md); color: var(--ink); }
.a-head .strip { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.a-head .strip .ico { width: 20px; height: 20px; }
.a-row.full .nm { color: var(--muted); }
.a-row.full .n { color: var(--good); }
.a-list { padding: 0 0 var(--sp-4) calc(170px + var(--sp-4)); }
.a-row:not(.open) .a-list { display: none; }
/* B · the board: the road on top, then the ten as cards in a grid, each with its count, its pips
   and its three nearest missing; a card opens its whole list below the grid. */
.b-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--sp-3); }
.b-card { display: grid; align-content: start; gap: var(--sp-2); padding: var(--sp-4); border: 1px solid var(--inv-line); text-align: left; transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease); }
.b-card:hover, .b-card.open { border-color: var(--accent-line); background: var(--veil); }
.b-card .top { display: flex; align-items: center; gap: var(--sp-3); }
.b-card .top .nm { flex: 1; font-family: var(--font-display); font-size: var(--fs-sm); letter-spacing: var(--track-title); color: var(--ink-strong); }
.b-card .next { display: grid; gap: 2px; font-size: var(--fs-xs); color: var(--ink-2); }
.b-card .next span { color: var(--muted); }
.b-card.full { opacity: 0.6; }
.b-open { margin-top: var(--sp-6); }
/* C · three tabs: the road, the 100% (the categories as today's lists, in two columns), and the
   other collectibles; one at a time behind the pips. */
.c-tabs { display: flex; justify-content: center; margin-bottom: var(--sp-6); }
.c-cols { columns: 2 320px; column-gap: var(--sp-8); }
.c-cols section { break-inside: avoid; margin-bottom: var(--sp-6); }

/* ── The road summary, three ways (Albert: the numbered box isn't attractive) ─────────── */
/* 1 · the journey: five diamonds on one thread, the current one larger, its name under it. */
.r1 { display: grid; gap: var(--sp-3); justify-items: center; margin: 0 auto var(--sp-8); max-width: var(--column); text-align: center; }
.r1 .sup { font-family: var(--font-display); font-size: var(--fs-sm); letter-spacing: var(--track-wide); text-transform: uppercase; color: var(--ink-2); }
.r1 .thread { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; }
.r1 .thread::before { content: ''; position: absolute; left: 10%; right: 10%; top: 50%; height: 1px; background: linear-gradient(90deg, var(--silk) var(--f), color-mix(in oklab, var(--silk-rim) 35%, transparent) var(--f)); }
.r1 .st { position: relative; display: grid; justify-items: center; gap: var(--sp-2); }
.r1 .st i { width: 12px; height: 12px; transform: rotate(45deg); border: 1px solid var(--silk-rim); background: var(--scene-bg); }
.r1 .st.done i { background: var(--silk); border-color: var(--silk); box-shadow: 0 0 8px color-mix(in oklab, var(--silk) 60%, transparent); }
.r1 .st.cur i { width: 18px; height: 18px; border-color: var(--accent); box-shadow: var(--glow); }
.r1 .labels { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; font-size: var(--fs-xs); color: var(--muted); }
.r1 .labels span.cur { color: var(--ink-strong); }
.r1 .now { font-family: var(--font-display); font-size: var(--fs-lg); letter-spacing: var(--track-title); color: var(--ink-strong); }
.r1 .now b { font-family: var(--font-num); font-size: var(--fs-sm); color: var(--ink-2); margin-left: var(--sp-2); }
/* 2 · the quest card: the game's Tasks pane: a super-title, the step as headline, its pips. */
.r2 { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-2) var(--sp-6); align-items: center; max-width: var(--column); margin: 0 auto var(--sp-8); padding: var(--sp-6) var(--sp-8); background: radial-gradient(ellipse 70% 90% at 15% 50%, var(--scene-glow-low), transparent 80%); }
.r2 img { grid-row: span 4; width: var(--sp-16); height: var(--sp-16); object-fit: contain; filter: drop-shadow(0 0 12px color-mix(in oklab, var(--spotlight) 40%, transparent)); }
.r2 .sup { font-family: var(--font-display); font-size: var(--fs-xs); letter-spacing: var(--track-wide); text-transform: uppercase; color: var(--ink-2); }
.r2 h3 { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); }
.r2 .meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); font-size: var(--fs-sm); color: var(--muted); }
.r2 .meta .n { font-size: var(--fs-md); }
/* 3 · a ledger row: the road as the ledger's first row. */
[data-road="3"] .a-row:first-child .nm { font-family: var(--font-display); letter-spacing: var(--track-title); color: var(--ink-strong); }

@media (max-width: 599px) { .a-head { grid-template-columns: minmax(0, 1fr) auto auto; } .a-head .strip { display: none; } .a-list { padding-left: 0; } }

<script>
(function () {
  const DEF = { v: 'a', road: '1', w: '1440', tab: 'pct' };
  const q = new URLSearchParams(location.search);

  // The ten, as the 100% counts them (whole masks of four shards, whole spools of two fragments).
  const CATS = [['tools', 'Tools', 1, (x) => 'assets/icons/tools/' + x[4] + '.webp'], ['spools', 'Silk Spools', 2, () => 'assets/icons/items/spool-fragment.webp'],
    ['upgrades', 'Crafting Kit and Tool Pouch', 1, (x) => 'assets/icons/items/' + (x[0] === 'Tool Pouch' ? 'tool-pouch' : 'crafting-kit') + '.webp'], ['arts', 'Abilities', 1, (x) => 'assets/icons/arts/' + x[4] + '.webp'],
    ['skills', 'Silk Skills', 1, (x) => 'assets/icons/skills/' + x[4] + '.webp'], ['crests', 'Crests', 1, (x) => 'assets/icons/crests/' + x[4] + '.webp'],
    ['masks', 'Masks', 4, () => 'assets/icons/items/mask-shard.webp'], ['needle', 'Needle upgrades', 1, (x, i) => 'assets/needles/' + (i + 1) + '.png'],

  const ROADS = {

    3: '',
  };
  let open = 'masks';

    let h = totalHtml;
    const roadRow = st.road === '3' ? '<div class="a-row' + (open === 'road' ? ' open' : '') + '"><button type="button" class="a-head" data-open="road"><span class="nm">The road to Act 3</span>' + pips(0, 5) + '<span class="n">0<i>/5</i></span><span class="disc-ring"><svg class="ic chev" width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 1.5 L6 6 L11 1.5"/></svg></span></button><div class="a-list">' + road + '</div></div>' : '';
    if (st.v === 'a') h += ROADS[st.road] + '<div class="a-rows" data-road="' + st.road + '">' + roadRow + CATS.map(([k, name, per, f]) => { const [g, m] = cnt(k, per); return '<div class="a-row' + (g >= m ? ' full' : '') + (open === k ? ' open' : '') + '"><button type="button" class="a-head" data-open="' + k + '"><span class="nm">' + name + '</span>' + strip(k, f) + '<span class="n">' + g + '<i>/' + m + '</i></span><span class="disc-ring"><svg class="ic chev' + (open === k ? ' up' : '') + '" width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 1.5 L6 6 L11 1.5"/></svg></span></button><div class="a-list">' + rowsOf(k) + '</div></div>'; }).join('') + '</div>';
    if (st.v === 'b') h += road + '<div class="b-grid">' + CATS.map(([k, name, per, f]) => { const [g, m] = cnt(k, per); const next = P[k].filter((x) => !x[1]).slice(0, 3); return '<button type="button" class="b-card' + (g >= m ? ' full' : '') + (open === k ? ' open' : '') + '" data-open="' + k + '"><span class="top"><img class="ico" src="' + f(P[k][0], 0) + '" alt=""><span class="nm">' + name + '</span><span class="n">' + g + '<i>/' + m + '</i></span></span>' + pips(g, Math.min(m, 51)) + '<span class="next">' + next.map((x) => '<span>' + x[0] + ' · ' + (x[3] || ('Act ' + x[2])) + '</span>').join('') + '</span></button>'; }).join('') + '</div>' + (open ? '<section class="b-open"><h3 class="ct-h">' + CATS.find((c) => c[0] === open)[1] + '</h3>' + rowsOf(open) + '</section>' : '');
    if (st.v === 'c') h += '<div class="c-tabs"><div class="seg">' + [['road', 'The road to Act 3'], ['pct', 'Your 100%'], ['other', 'Other collectibles']].map(([k, l]) => '<button type="button" data-tab="' + k + '" aria-pressed="' + (st.tab === k) + '">' + l + '</button>').join('') + '</div></div>' + (st.tab === 'road' ? road : st.tab === 'pct' ? '<div class="c-cols">' + CATS.map(([k, name, per]) => { const [g, m] = cnt(k, per); return '<section><h3 class="ct-h">' + name + ' <span class="n">' + g + '<i>/' + m + '</i></span></h3>' + rowsOf(k) + '</section>'; }).join('') + '</div>' : '<p class="r">Memory Lockets, Craftmetal, Pale Oil, the Lost Fleas, the enemy gauntlets…</p>');
    document.getElementById('mk').innerHTML = h;
  }
  const url = (over) => '?' + new URLSearchParams(Object.assign({}, st, over)).toString();
  if (st.w === '390' && !inner) { html.classList.add('is-framed'); document.querySelector('.page').remove(); const f = document.createElement('iframe'); f.className = 'mk-phone'; f.src = location.pathname + url({ inner: 1 }); document.body.prepend(f); }
  if (inner) html.classList.add('is-inner');
  for (const b of document.querySelectorAll('.mk-bar button')) b.setAttribute('aria-pressed', String(st[b.dataset.key] === b.dataset.val));
  document.getElementById('mk-note').textContent = NOTES[st.v] + (st.v === 'a' ? '   Road ' + { 1: '1 · the journey: five diamonds on a thread, the current one lit, its name and count under it.', 2: '2 · the quest card: the step as a headline, its pips and the next step, as the game\'s Tasks pane.', 3: '3 · a ledger row: the road as the first row, opening to the whole road.' }[st.road] : '');
  if (document.getElementById('mk')) render();
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.mk-bar button'); if (b) { location.search = url({ [b.dataset.key]: b.dataset.val }); return; }
    const t = e.target.closest('[data-tab]'); if (t) { st.tab = t.dataset.tab; render(); return; }
    const o = e.target.closest('[data-open]'); if (o) { open = open === o.dataset.open ? null : o.dataset.open; render(); }
  });
})();
</script>
</body>
</html>
