<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Combat: variants</title>
<!-- Design material, not part of the site (design/03-redesign.md, step 9). Combat drawn three ways
     over Save 4's build against Lace (250 health; the figures are today's screen's). Hornet is the
     site's own frame (assets/hornet/idle.png), Lace the Journal's whole drawing. ?v=a|b|c&w=1440|390 -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
.mk-bar { position: fixed; z-index: 90; left: 50%; bottom: var(--sp-2); transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1) var(--sp-3); width: max-content; max-width: calc(100vw - var(--sp-4)); padding: var(--sp-2) var(--sp-3); background: color-mix(in oklab, var(--scene-bg) 94%, transparent); border: 1px solid var(--line-panel); font-family: var(--font-num); font-size: var(--fs-xs); color: var(--muted); }
.mk-bar b { color: var(--label); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; font-size: var(--fs-2xs); }
.mk-bar button { padding: var(--sp-1) var(--sp-2); border: 1px solid var(--line-ctl); color: var(--ink-2); font: inherit; }
.mk-bar button[aria-pressed="true"] { color: var(--ink-strong); border-color: var(--accent-line); background: var(--picked); }
.mk-note { flex-basis: 100%; text-align: center; color: var(--ink-2); }
html.is-framed body { background: var(--scene-bg); }
.mk-phone { display: block; margin: var(--sp-4) auto calc(var(--sp-16) * 2); width: 390px; height: calc(100vh - var(--sp-16) * 2 - var(--sp-8)); border: 1px solid var(--line-panel); }
html.is-inner .mk-bar { display: none; }
.page { padding-top: var(--sp-8); padding-bottom: calc(var(--sp-16) * 2.5); }
.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-strong); }
.lbl { margin: 0; font-family: var(--font-num); font-size: var(--fs-2xs); font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--label); }
.picker { display: flex; align-items: center; gap: var(--sp-3); max-width: 560px; margin: var(--sp-4) auto 0; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--line-ctl); }
.picker img { width: 32px; height: 32px; object-fit: contain; }
.picker span { flex: 1; font-family: var(--font-display); color: var(--ink-strong); }
.picker small { color: var(--muted); font-size: var(--fs-xs); }
.lit { position: relative; display: grid; place-items: center; }
.lit::before { content: ''; position: absolute; inset: -10%; background: var(--journal-light); pointer-events: none; }
.lit img { position: relative; }
.hpbar { width: 100%; height: 6px; background: var(--ring-track); } .hpbar i { display: block; height: 100%; width: 100%; background: var(--slot-red); opacity: .8; }
.masks { display: flex; gap: 3px; justify-content: center; } .masks img { height: 22px; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--sp-4); }
.act { display: grid; justify-items: center; gap: var(--sp-1); text-align: center; }
.act img { width: 48px; height: 48px; object-fit: contain; }
.act b { font-size: var(--fs-xl); }
.act em { font-style: normal; font-size: var(--fs-xs); color: var(--muted); }
.act.is-best { outline: 1px solid var(--accent-line); outline-offset: var(--sp-2); }
.theirs { display: grid; gap: var(--sp-1); }
.theirs li { display: flex; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--ink-2); padding: var(--sp-1) 0; border-bottom: 1px solid var(--line); }
.theirs ul { list-style: none; margin: 0; padding: 0; }
.theirs .m { display: inline-flex; gap: 2px; } .theirs .m img { height: 14px; }
.h3 { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-8) 0 var(--sp-4); font-family: var(--font-display); font-size: var(--fs-sm); color: var(--filigree); }
.h3::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in oklab, var(--filigree) 40%, transparent), transparent); }

/* A · the duel */
.duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--sp-6); align-items: end; margin-top: var(--sp-6); }
.side { display: grid; justify-items: center; gap: var(--sp-3); }
.side h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); color: var(--ink-strong); }
.side .art { height: 220px; }
.side .art img { max-height: 200px; }
.mid { display: grid; justify-items: center; gap: var(--sp-2); padding-bottom: var(--sp-12); text-align: center; }
.mid b { font-size: calc(var(--fs-2xl) * 2); line-height: 1; }
.mid .sub b { font-size: var(--fs-2xl); }
.mid p { margin: 0; font-size: var(--fs-xs); color: var(--muted); }
.best { margin: var(--sp-2) auto 0; max-width: 520px; text-align: center; font-size: var(--fs-sm); color: var(--ink-2); }
.best b { color: var(--ink-strong); font-family: var(--font-display); font-weight: 400; }
.two { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--sp-8); }

/* B · the enemy's page */
.bpage { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-8); align-items: center; margin-top: var(--sp-6); }
.bpage .art { height: 300px; } .bpage .art img { max-height: 280px; }
.bstats { display: grid; gap: var(--sp-4); }
.bstats h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-2xl); color: var(--ink-strong); }
.bbars { display: grid; gap: var(--sp-2); }
.bbar { display: grid; grid-template-columns: 28px 110px minmax(0, 1fr) 70px; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--ink-2); }
.bbar img { width: 24px; height: 24px; object-fit: contain; }
.bbar .t { height: 10px; display: flex; gap: 2px; } .bbar .t i { flex: 1; background: color-mix(in oklab, var(--accent) 70%, transparent); }
.bbar b { text-align: right; }

/* C · choose, then fight */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--sp-3); margin-top: var(--sp-4); }
.cfoe { display: grid; justify-items: center; gap: var(--sp-1); font-size: var(--fs-xs); color: var(--ink-2); text-align: center; }
.cfoe .hj-ring { width: 64px; }
.cfoe.is-on .hj-ring { outline: 1px solid var(--accent); outline-offset: 4px; }
.sheet { max-width: 760px; margin: var(--sp-6) auto 0; padding: var(--sp-6); border: 1px solid var(--line-ctl); background: var(--scene-floor); box-shadow: var(--shadow-md); }
@media (max-width: 899px) {
  .duel { grid-template-columns: 1fr 1fr; } .mid { grid-column: 1 / -1; grid-row: 2; padding: 0; }
  .side .art { height: 140px; } .side .art img { max-height: 130px; }
  .two, .bpage { grid-template-columns: 1fr; }
  .bpage .art { height: 200px; } .bpage .art img { max-height: 190px; }
  .bbar { grid-template-columns: 24px 90px minmax(0, 1fr) 56px; }
}
</style>
</head>
<body>
<div class="page"><div class="shell"><main class="screens">
<section class="screen" id="scr"><span class="frame-line"></span>
  <header class="screen-head"><h2 class="sec-title screen-title">Combate</h2></header>
  <div id="mk"></div>
</section></main></div></div>
<div class="mk-bar"><b>Variant</b><button data-key="v" data-val="a">A · el duelo</button><button data-key="v" data-val="b">B · la ficha del enemigo</button><button data-key="v" data-val="c">C · elige y lucha</button>
  <b>Width</b><button data-key="w" data-val="1440">desktop</button><button data-key="w" data-val="390">390</button><span class="mk-note" id="note"></span></div>
<script>
(function () {
  const DEF = { v: 'a', w: '1440' };
  const q = new URLSearchParams(location.search);
  const st = Object.fromEntries(Object.keys(DEF).map((k) => [k, q.get(k) || DEF[k]]));
  const inner = q.has('inner'), html = document.documentElement;
  const MASK = '<img src="assets/hud/mask.png" alt="">';
  const picker = '<div class="picker"><img src="assets/icons/journal/lace.webp" alt=""><span>Lace</span><small>Deep Docks · jefe</small><span style="flex:none">⌄</span></div>';
  const ACTS = [['assets/needles/3.png', 'Tajo', 22, 12], ['assets/icons/skills/thread-storm.webp', 'Tormenta de hilos', 56, 5], ['assets/icons/tools/cogfly.webp', 'Mosca de engranaje', 40, 7], ['', 'Golpe concentrado', 62, 5]];
  const acts = (best) => '<div class="acts">' + ACTS.map(([img, n, d, k], i) => '<div class="act' + (best && i === 2 ? ' is-best' : '') + '">' + (img ? '<img src="' + img + '" alt="">' : '<img src="assets/icons/skills/silkspear.webp" alt="" style="opacity:.0">') + '<span style="font-size:var(--fs-sm);color:var(--ink-2)">' + n + '</span><b class="n">' + d + '</b><em>' + k + ' para matarla</em></div>').join('') + '</div>';
  const THEIRS = [['Estocada', 1], ['Doble corte', 1], ['Balestra', 1], ['Parada y réplica', 2], ['Molinete', 2]];
  const theirs = '<div class="theirs"><ul>' + THEIRS.map(([n, m]) => '<li><span>' + n + '</span><span class="m">' + MASK.repeat(m) + '</span></li>').join('') + '</ul><p style="margin:var(--sp-2) 0 0;font-size:var(--fs-xs);color:var(--muted)">Con tus 7 máscaras: 7 golpes te tumban, 10 si enlazas.</p></div>';
  const NOTES = {
    a: 'A · el duelo (la web hermana): Hornet frente al enemigo, su dibujo entero del Diario; en medio los tajos que te faltan para ganar y los golpes suyos que aguantas; debajo la forma más rápida en una línea; luego tus ataques como tarjetas (el más rápido marcado) y los suyos con sus máscaras. El enemigo se elige en un desplegable con buscador, no una lista de 1300 px. Las notas largas, plegadas.',
    b: 'B · la ficha del enemigo: su dibujo grande sobre la luz del Diario y, al lado, su nombre, vida, a partir de qué golpes se aturde, sus fases; tus ataques como barras de golpes para matarlo (una raya por golpe), y lo que te hace, en máscaras.',
    c: 'C · elige y lucha: primero todos los enemigos como retratos en anillo (como el Diario), por zonas; al tocar uno se abre el duelo en una ficha encima, como la entrada del Diario.' };
  function render() {
    let h = '';
    if (st.v === 'a') h = picker + '<div class="duel"><div class="side"><div class="art lit"><img src="assets/hornet/idle.png" alt=""></div><h3>Hornet</h3><div class="masks">' + MASK.repeat(7) + '</div></div>' +
      '<div class="mid"><b class="n">12</b><p>tajos para ganar</p><div class="sub" style="margin-top:var(--sp-4)"><b class="n">7</b><p>golpes suyos te tumban</p></div></div>' +
      '<div class="side"><div class="art lit"><img src="assets/journal/art/name_lace.webp" alt=""></div><h3>Lace</h3><div class="hpbar"><i></i></div><p class="lbl">250 de vida · fase 2 a 125</p></div></div>' +
      '<p class="best">Lo más rápido: <b>7 × Mosca de engranaje</b>, luego tajos.</p>' +
      '<div class="two"><div><p class="h3">Lo que le haces</p>' + acts(true) + '</div><div><p class="h3">Lo que te hace</p>' + theirs + '</div></div><p class="h3">Cómo se calcula ⌄</p>';
    if (st.v === 'b') h = picker + '<div class="bpage"><div class="art lit"><img src="assets/journal/art/name_lace.webp" alt=""></div><div class="bstats"><h3>Lace</h3><p class="lbl">250 de vida · se aturde tras 11 golpes · fase 2 a 125</p>' +
      '<div class="bbars">' + ACTS.map(([img, n, d, k]) => '<div class="bbar">' + (img ? '<img src="' + img + '" alt="">' : '<span></span>') + '<span>' + n + '</span><span class="t">' + '<i></i>'.repeat(k) + '</span><b class="n">' + k + ' golpes</b></div>').join('') + '</div>' +
      '<p class="best" style="text-align:left;margin:0">Lo más rápido: <b>7 × Mosca de engranaje</b>, luego tajos.</p></div></div><p class="h3">Lo que te hace</p>' + theirs;
    if (st.v === 'c') {
      const ids = ['moss-mother', 'skull-tyrant', 'savage-beastfly', 'bell-beast', 'lace', 'fourth-chorus', 'moorwing', 'last-judge', 'widow', 'sister-splinter', 'groal-the-great', 'crawfather'];
      h = '<p class="h3">Deep Docks · Greymoor · …</p><div class="cgrid">' + ids.map((id) => '<div class="cfoe' + (id === 'lace' ? ' is-on' : '') + '"><span class="hj-ring is-seen" style="--f:1"><img src="assets/icons/journal/' + id + '.webp" alt="" onerror="this.style.visibility=\'hidden\'"></span><span>' + id.replace(/-/g, ' ') + '</span></div>').join('') + '</div>' +
        '<div class="sheet"><div class="duel" style="margin-top:0"><div class="side"><div class="art lit"><img src="assets/hornet/idle.png" alt=""></div></div><div class="mid"><b class="n">12</b><p>tajos para ganar</p><div class="sub" style="margin-top:var(--sp-4)"><b class="n">7</b><p>golpes suyos te tumban</p></div></div><div class="side"><div class="art lit"><img src="assets/journal/art/name_lace.webp" alt=""></div></div></div>' + acts(true) + '</div>';
    }
    document.getElementById('mk').innerHTML = h;
  }
  const url = (over) => '?' + new URLSearchParams(Object.assign({}, st, over)).toString();
  if (st.w === '390' && !inner) { html.classList.add('is-framed'); document.querySelector('.page').remove(); const f = document.createElement('iframe'); f.className = 'mk-phone'; f.src = location.pathname + url({ inner: 1 }); document.body.prepend(f); }
  if (inner) html.classList.add('is-inner');
  for (const b of document.querySelectorAll('.mk-bar button')) b.setAttribute('aria-pressed', String(st[b.dataset.key] === b.dataset.val));
  document.getElementById('note').textContent = NOTES[st.v];
  if (document.getElementById('mk')) render();
  document.addEventListener('click', (ev) => { const b = ev.target.closest('.mk-bar button'); if (b) location.search = url({ [b.dataset.key]: b.dataset.val }); });
})();
</script>
</body>
</html>
