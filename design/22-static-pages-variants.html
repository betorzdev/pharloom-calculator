const ABOUT = "<section class=\"about\" id=\"about\" lang=\"en\" aria-labelledby=\"about-h\">\n      <h1 id=\"about-h\">Lace: health, attacks and hits to kill</h1>\n      <p>A boss fight in Hollow Knight: Silksong against <strong>Lace</strong>, in Deep Docks and The Cradle. The Hunter's Journal says: \"Manic fencer who delights in battle.\"</p>\n      <p>Fought 2 times: Lace, 250 health; Lace (The Cradle), 800 health.</p>\n      <p>With the Needle alone (a Hunter's Crest with no Tools or modifiers), with the Needle, Sharpened Needle, Shining Needle, Hivesteel Needle and Pale Steel Needle: Lace: 50, 28, 20, 15 and 12 slashes; Lace (The Cradle): 89, 73, 62, 58 and 45 slashes.</p>\n      <p>With the Hunter's Crest, a slash every 0.41 s (the game's own pace, from its files): with the Pale Steel Needle, 4.5 s of nonstop slashing.</p>\n      <p>Attacks, as the wiki names them (the game doesn't): Lunge, Double Cut, Balestra, Parry & Riposte (2 masks), Flourish, Retreat, Advance, Moulinet (2 masks), Triple Cut, Double Lunge.</p>\n      <p>Staggered after 11 and 16 hits.</p>\n      <p>Phases, from the game's own files: Lace: phase 2 at 125 health (50%); Lace (The Cradle): phase 2 at 600 health (75%) and phase 3 at 320 health (40%).</p>\n      <p>Reward: Silk Heart.</p>\n      <p>This page opens the damage calculator with this boss picked: with your save or your build, each of your attacks' damage, how many it takes, and what each of its attacks does to you.</p>\n      <div class=\"about-faq\">\n        <h2>Questions</h2>\n        <h3>What is Lace's health in Silksong?</h3>\n        <p>Fought 2 times: Lace, 250 health; Lace (The Cradle), 800 health.</p>\n        <h3>How many hits does it take to beat Lace?</h3>\n        <p>It depends on your Needle and your Tools: with the Needle alone, from 50 slashes with the Needle to 12 with the Pale Steel Needle. For your exact build, open the calculator on this page.</p>\n      </div>\n      <nav class=\"about-more\" aria-label=\"More o   }
  const url = (over) => '?' + new URLSearchParams(Object.assign({}, st, over)).toString();
  if (st.w === '390' && !inner) { html.classList.add('is-framed'); document.querySelector('.page').remove(); const f = document.createElement('iframe'); f.className = 'mk-phone'; f.src = location.pathname + url({ inner: 1 }); document.body.prepend(f); }
  if (inner) html.classList.add('is-inner');
  for (const b of document.querySelectorAll('.mk-bar button')) b.setAttribute('aria-pressed', String(st[b.dataset.key] === b.dataset.val));
  document.getElementById('note').textContent = NOTES[st.v];
  if (document.getElementById('mk')) render();
  document.addEventListener('click', (ev) => { const b = ev.target.closest('.mk-bar button'); if (b) location.search = url({ [b.dataset.key]: b.dataset.val }); });
})();
</script>
</body>
