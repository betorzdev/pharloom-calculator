<title>Journal entry: variants</title>
<!-- Design material, not part of the site (design/03-redesign.md, step 7, third round). An entry's
     whole drawing, as the game's Journal pane shows it: the enemySprite of each EnemyJournalRecord
     (journalrecords.bundle), from the journal_enemy_images sprite atlas, at 64 px to the unit like
     every Journal drawing; the pane (coremanagers_assets__gamecameras.bundle, "Journal") sets it on
     a soft light (light_effect_v02, grey 0.81) between the list and the name, description and the
     Hunter's notes under hunter_symbol. Seven real drawings inlined; kills from Save 4. ?v=a|b|c&w=1440|390 -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
.mk-bar { position: fixed; z-index: 90; left: 50%; bottom: var(--sp-2); transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1) var(--sp-3); width: max-content; max-width: calc(100vw - var(--sp-4)); padding: var(--sp-2) var(--sp-3); background: color-mix(in oklab, var(--scene-bg) 94%, transparent); border: 1px solid var(--line-panel); font-family: var(--font-num); font-size: var(--fs-xs); color: var(--muted); }
.mk-bar b { color: var(--label); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; font-size: var(--fs-2xs); }
.mk-bar button { padding: var(--sp-1) var(--sp-2); border: 1px solid var(--line-ctl); color: var(--ink-2); font: inherit; }
.mk-bar button[aria-pressed="true"] { color: var(--ink-strong); border-color: var(--accent-line); background: var(--picked); }
.mk-note { flex-basis: 100%; text-align: center; color: var(--ink-2); }
html.is-framed body { background: var(--scene-bg); }
.mk-phone { display: block; margin: var(--sp-4) auto calc(var(--sp-16) * 2); width: 390px; height: calc(100vh - var(--sp-16) * 2 - var(--sp-8)); border: 1px solid var(--line-panel); }
html.is-inner .mk-bar { display: none; }
.page { padding-top: var(--sp-8); padding-bottom: calc(var(--sp-16) * 2.5); }
.picker { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); margin: var(--sp-4) 0 var(--sp-6); }
.picker button { padding: 0; border: 0; background: none; }
.picker .hj-ring { width: 52px; }
.picker button[aria-pressed="true"] .hj-ring { outline: 1px solid var(--accent); outline-offset: var(--sp-1); }
.hint { text-align: center; color: var(--muted); font-size: var(--fs-xs); margin: 0; }
/* The game's light behind the drawing (light_effect_v02 at 0.81 grey): a soft white disc. */
.lit { position: relative; display: grid; place-items: center; }
.lit::before { content: ''; position: absolute; inset: -12%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in oklab, var(--silk) 22%, transparent), color-mix(in oklab, var(--silk) 7%, transparent) 55%, transparent); pointer-events: none; }
.lit img { position: relative; image-rendering: auto; }
.kills { margin: 0; font-family: var(--font-num); color: var(--ink-strong); } .kills i { font-style: normal; color: var(--muted); font-size: var(--fs-xs); }
.nm { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); }
.dv { width: 60%; height: 1px; margin: var(--sp-1) auto; background: linear-gradient(90deg, transparent, var(--filigree), transparent); opacity: .6; }
.ds { margin: 0; color: var(--ink-2); font-size: var(--fs-sm); text-wrap: pretty; }
.nt { margin: 0; font-family: var(--font-hand); font-size: var(--fs-md); line-height: 1.45; color: var(--ink); }
.nt-lock { margin: 0; color: var(--muted); font-size: var(--fs-xs); font-style: italic; }
.hsym { width: 150px; opacity: .8; margin: var(--sp-2) auto 0; display: block; }
.x { position: absolute; top: var(--sp-2); right: var(--sp-2); }

/* A · the game's page: a wide modal, the drawing on its light at the game's size (capped), the text beside it. */
.a-page { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--sp-8); align-items: center; max-width: 900px; margin: 0 auto; padding: var(--sp-12) var(--sp-8); background: var(--scene-floor); border: 1px solid var(--line-ctl); box-shadow: var(--shadow-md); }
.a-art { min-height: 380px; }
.a-art img { max-width: 100%; max-height: 420px; }
.a-text { display: grid; gap: var(--sp-3); text-align: center; }

/* B · the sheet, the drawing in place of the round portrait, fitted to one box. */
.b-sheet { position: relative; width: 360px; margin: 0 auto; padding: var(--sp-8) var(--sp-6) var(--sp-6); background: var(--scene-floor); border: 1px solid var(--line-ctl); box-shadow: var(--shadow-md); display: grid; gap: var(--sp-3); text-align: center; }
.b-art { height: 240px; }
.b-art img { max-width: 280px; max-height: 220px; width: auto; height: auto; }
.bar { height: 3px; background: var(--ring-track); } .bar i { display: block; height: 100%; background: var(--silk); }
.bar.is-done i { background: var(--accent); box-shadow: var(--glow); }

/* C · today's sheet, and a tap on the portrait opens the drawing full screen. */
.c-wrap { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: var(--sp-6); align-items: start; }
.c-sheet { position: relative; padding: var(--sp-8) var(--sp-6) var(--sp-6); background: var(--scene-floor); border: 1px solid var(--line-ctl); display: grid; gap: var(--sp-2); justify-items: center; text-align: center; }
.c-sheet .hj-ring { width: 120px; cursor: zoom-in; }
.c-full { position: relative; min-height: 520px; display: grid; place-items: center; background: color-mix(in oklab, var(--scene-floor) 92%, transparent); border: 1px solid var(--line-ctl); }
.c-full img { max-width: 90%; max-height: 480px; }
.c-full .cap { position: absolute; bottom: var(--sp-4); left: 0; right: 0; text-align: center; font-family: var(--font-display); color: var(--ink-strong); }

@media (max-width: 899px) {
  .a-page { grid-template-columns: 1fr; padding: var(--sp-8) var(--sp-4); gap: var(--sp-4); }
  .a-art { min-height: 220px; } .a-art img { max-height: 260px; }
  .b-sheet { width: auto; }
  .c-wrap { grid-template-columns: 1fr; }
  .c-full { min-height: 60vh; }
}
</style>

  const X = '<button type="button" class="icon-btn x" aria-label="Close">×</button>';
  const NOTES = {
    a: 'A · the game\'s page: as the pane the game opens (the drawing between the list and the text): a wide sheet in the middle, the whole drawing on its soft light at the size the game draws it, so a Mossgrub is small and a boss fills it; beside it the name, the kills, the description and the Hunter\'s notes under his symbol, or the game\'s «Defeat 9 more to complete the hunter\'s notes.». On a phone, the drawing above the text.',
    b: 'B · drawing in the sheet: the side sheet as today, with the whole drawing on its light in place of the round portrait, every drawing fitted to the same box; the kills as a thin bar under it.',
    c: 'C · full screen on a tap: the sheet as today; a tap on its portrait opens the whole drawing large, alone on the black, with its name.' };
  function render() {
    const e = E.find((x) => x.id === st.e) || E[0];
    document.getElementById('pick').innerHTML = E.map((x) => '<button type="button" data-e="' + x.id + '" aria-pressed="' + (x === e) + '" title="' + x.name + '">' + ring(x) + '</button>').join('');
    let h = '';
    if (st.v === 'a') h = '<div class="a-page">' + X + '<div class="lit a-art">' + art(e) + '</div><div class="a-text"><h3 class="nm">' + e.name + '</h3><div class="dv"></div>' + kills(e) + '<p class="ds">' + e.desc + '</p>' + notes(e) + '</div></div>';
    if (st.v === 'b') h = '<div class="b-sheet">' + X + '<div class="lit b-art"><img src="' + e.img + '" alt=""></div><div class="bar' + (state(e) === 'done' ? ' is-done' : '') + '"><i style="width:' + Math.max(0, Math.min(100, e.have / e.need * 100)) + '%"></i></div>' + kills(e) + '<h3 class="nm">' + e.name + '</h3><p class="ds">' + e.desc + '</p>' + notes(e) + '</div>';
    if (st.v === 'c') h = '<div class="c-wrap"><div class="c-sheet">' + X + ring(e) + kills(e) + '<h3 class="nm">' + e.name + '</h3><p class="ds">' + e.desc + '</p></div><div class="c-full">' + X + '<div class="lit">' + '<img src="' + e.img + '" alt="" style="width:' + Math.min(e.w * 1.6, 900) + 'px">' + '</div><p class="cap">' + e.name + '</p></div></div>';
    document.getElementById('mk').innerHTML = h;
  }
  const url = (over) => '?' + new URLSearchParams(Object.assign({}, st, over)).toString();
  if (st.w === '390' && !inner) { html.classList.add('is-framed'); document.querySelector('.page').remove(); const f = document.createElement('iframe'); f.className = 'mk-phone'; f.src = location.pathname + url({ inner: 1 }); document.body.prepend(f); }
  if (inner) html.classList.add('is-inner');
  for (const b of document.querySelectorAll('.mk-bar button')) b.setAttribute('aria-pressed', String(st[b.dataset.key] === b.dataset.val));
  document.getElementById('note').textContent = NOTES[st.v];
  if (document.getElementById('mk')) render();
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('.mk-bar button'); if (b) { location.search = url({ [b.dataset.key]: b.dataset.val }); return; }
    const p = ev.target.closest('[data-e]'); if (p) { st.e = p.dataset.e; history.replaceState(null, '', url({})); render(); }
  });
})();
</script>
</body>
</html>
